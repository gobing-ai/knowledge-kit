telemetry = false

[install]
exact = true

[test]
coverage = true
coverageDir = ".coverage"
coverageReporter = ["text", "lcov"]
coverageThreshold = { lines = 0.9, functions = 0.9 }
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["vendors/**", "build/**", "dist/**", "node_modules/**",
	# decision-hub.test.ts writes a broken-hub.ts hub fixture into a mkdtemp dir and
	# dynamically imports it; bun's coverage instruments the temp module, which then
	# shows up in the summary as an absolute /private/var/... path.
	"**/kk-decision-hub-*/**",
	# chromium.ts drives real headless Chromium via Playwright. Its only coverage is
	# tests/compose-e2e.test.ts, which skips where Playwright's Chromium is not
	# installed, so per-file coverage would depend on the machine.
	"**/compose/chromium.ts",
	# jike-composer-runner.ts is a subprocess-only real-Chromium fixture (module entry
	# behind import.meta.main, launch via Playwright); bun test exercises it via
	# spawnSync, whose coverage bun cannot attribute to this file.
	"**/tests/fixtures/jike-composer-runner.ts",
	# csdn-composer-runner.ts is a subprocess-only real-Chromium fixture (module entry
	# behind import.meta.main, launch via Playwright); bun test exercises it via
	# spawnSync, whose coverage bun cannot attribute to this file.
	"**/tests/fixtures/csdn-composer-runner.ts",
	# cnblogs-pub-dom-runner.ts is a subprocess-only real-Chromium fixture (module entry
	# behind import.meta.main, launch via Playwright); bun test exercises it via
	# spawnSync, whose coverage bun cannot attribute to this file.
	"**/tests/fixtures/cnblogs-pub-dom-runner.ts",
	# sspai-pub-dom-runner.ts is a subprocess-only real-Chromium fixture (module entry
	# behind import.meta.main, launch via Playwright); bun test exercises it via
	# spawnSync, whose coverage bun cannot attribute to this file.
	"**/tests/fixtures/sspai-pub-dom-runner.ts",
	# xiaoyuzhou-pub-dom-runner.ts is a subprocess-only real-Chromium fixture (module entry
	# behind import.meta.main, launch via Playwright); bun test exercises it via
	# spawnSync, whose coverage bun cannot attribute to this file.
	"**/tests/fixtures/xiaoyuzhou-pub-dom-runner.ts",
	# shipinhao-pub-dom-runner.ts is a subprocess-only real-Chromium fixture (module entry
	# behind import.meta.main, launch via Playwright); bun test exercises it via
	# spawnSync, whose coverage bun cannot attribute to this file.
	"**/tests/fixtures/shipinhao-pub-dom-runner.ts",
	# bilibili-pub-dom-runner.ts is a subprocess-only real-Chromium fixture (module entry
	# behind import.meta.main, launch via Playwright); bun test exercises it via
	# spawnSync, whose coverage bun cannot attribute to this file.
	"**/tests/fixtures/bilibili-pub-dom-runner.ts",
]
