"$schema": "@gobing-ai/spur/schemas/state-machine-workflow.schema.json"
kind: state-machine
name: judge-gated-publish
description: "Example workflow where an LLM-as-judge plugin step gates a publish transition"
initialState: generate
terminalStates:
  - done
  - failed
vars:
  contentFile: ".spur/run/content.json"
  verdictFile: ".spur/run/verdict.json"
  spurBin: "spur"
states:
  - id: generate
    description: "Generate content from brief or docs"
    onEnter:
      - kind: shell
        options:
          # Seed the verdict so the judge-gate guards can be evaluated in --dry-run
          # (dry-run skips actions but still evaluates shell guards). A real pipeline's
          # judge plugin overwrites this file before the gate is read.
          command: "echo '{\"verdict\":\"PASS\",\"score\":0.0}' > ${vars.verdictFile} && echo 'generating content...'"
  - id: judge
    description: "Evaluate generated content using judge plugin"
    onEnter:
      - kind: shell
        options:
          command: "echo '{\"verdict\":\"PASS\",\"score\":0.95}' > ${vars.verdictFile}"
  - id: publish
    description: "Publish content after clearing judge gate"
    onEnter:
      - kind: shell
        options:
          command: "echo 'publishing content...'"
  - id: done
    description: "Publish completed successfully"
  - id: failed
    description: "Judge rejected content or execution failed"

transitions:
  - from: generate
    to: judge
    description: "Content generated -> proceed to evaluation"
    guard:
      kind: always
  - from: judge
    to: publish
    description: "Judge verdict is PASS (or file absent under --dry-run) -> proceed to publish"
    guard:
      kind: shell
      options:
        # Fail-closed on an explicit non-PASS verdict; fail-open only when the file is
        # absent, which happens under --dry-run (actions are skipped, so the judge
        # never writes its verdict). A real run always has the file.
        command: 'v="$(jq -r .verdict ${vars.verdictFile} 2>/dev/null)"; test -z "$v" -o "$v" = PASS'
  - from: judge
    to: failed
    description: "Judge verdict is an explicit non-PASS -> block publish"
    guard:
      kind: shell
      options:
        command: 'v="$(jq -r .verdict ${vars.verdictFile} 2>/dev/null)"; test -n "$v" -a "$v" != PASS'
  - from: publish
    to: done
    description: "Publish done"
    guard:
      kind: always
