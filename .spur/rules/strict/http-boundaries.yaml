$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
# HTTP-client boundaries. Absorbed from
# ts-libs/.spur/rules/typescript/external-api-boundaries.yaml.
#
# SCOPE (fixed 2026-08-17): extended to `plugins/*/*/src/**` — every outbound HTTP
# call in knowledge-kit lives in a publish/ingestion plugin, so the previous
# apps+packages scope made these rules unreachable. `apps/cli/plugins/**` is the
# gitignored bundle-plugins.ts artifact and is excluded everywhere.
include:
  - "apps/**/src/**/*.ts"
  - "packages/**/src/**/*.ts"
  - "plugins/*/*/src/**/*.ts"
  - "apps/**/tests/**/*.ts"
  - "apps/**/tests/**/*.tsx"
  - "packages/**/tests/**/*.ts"
  - "packages/**/tests/**/*.tsx"
  - "plugins/*/*/tests/**/*.ts"
  - "scripts/**/*.ts"
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "apps/cli/plugins/**"

rules:
  - id: no-direct-fetch
    description: "Outbound HTTP belongs in a PublishTransport / ingestion deps seam, not scattered through plugin logic. Transport implementations are exempt — they ARE the HTTP boundary."
    severity: warning
    evaluator:
      type: rg
      config:
        pattern: "(^|[^.[:alnum:]_])fetch\\("
    include:
      - "apps/**/src/**/*.ts"
      - "packages/**/src/**/*.ts"
      - "plugins/*/*/src/**/*.ts"
    exclude:
      - "**/tests/**"
      - "**/*.test.ts"
      # These files implement PublishTransport (@gobing-ai/publish-harness); the
      # transport class is the sanctioned HTTP boundary, so `fetch` belongs here.
      - "plugins/publishings/qiita-pub/src/index.ts"
      - "plugins/publishings/emdash-pub/src/index.ts"
      - "plugins/publishings/medium-pub/src/index.ts"
      - "plugins/publishings/wechatmp-pub/src/index.ts"
      - "plugins/publishings/x-pub/src/index.ts"
      # threads-pub's index.ts implements PublishTransport (ThreadsPostApiTransport); the
      # transport class is the sanctioned HTTP boundary, exactly as for x-pub above.
      - "plugins/publishings/threads-pub/src/index.ts"
      # weibo-pub's index.ts implements PublishTransport (WeiboBrowserTransport). Its `fetch(` lives in
      # the page-context submit string (`kk-weibo-submit`) that posts the same request the mobile web
      # app issues — the transport's own HTTP boundary, evaluated in the browser, not scattered logic.
      - "plugins/publishings/weibo-pub/src/index.ts"
      # wechatmp-pub CGI media/draft (tasks 0289+0290): `fetch(` lives in the page-context scripts
      # cgi.ts/cgi-media.ts/cgi-draft.ts — credentialed filetransfer/cropimage/uploadimg2cdn/operate_appmsg posts issued BY the
      # authenticated mp.weixin.qq.com page (credentials:'include', redirect:'error'), the transport's own
      # HTTP boundary, not host-side scattered logic (host-side fetch stays forbidden by the Design).
      - "plugins/publishings/wechatmp-pub/src/cgi.ts"
      - "plugins/publishings/wechatmp-pub/src/cgi-media.ts"
      - "plugins/publishings/wechatmp-pub/src/cgi-draft.ts"
      # surfdash-pub's index.ts implements PublishTransport (PostsurfingFileCliTransport);
      # its awaitArticleLive poll is deploy-URL liveness verification at the boundary.
      - "plugins/publishings/surfdash-pub/src/index.ts"
      # podcast-pub's MicrofeedClient is its transport's HTTP boundary: the
      # PublishTransport in index.ts composes it (docs/design/podcast-pub.md D1).
      - "plugins/publishings/podcast-pub/src/microfeed-client.ts"
      # podcast-pub's index.ts implements PublishTransport; for D9 it fetches the
      # operator-supplied social-image URL to verify its 1200×630 dimensions before
      # sending it. That is boundary verification, not scattered plugin logic.
      - "plugins/publishings/podcast-pub/src/index.ts"

  - id: no-globalthis-fetch
    description: "Avoid globalThis.fetch(...); route HTTP through a client seam when one exists."
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "globalThis\\.fetch\\("
    include:
      - "apps/**/src/**/*.ts"
      - "packages/**/src/**/*.ts"
      - "plugins/*/*/src/**/*.ts"
      - "apps/**/tests/**/*.ts"
      - "apps/**/tests/**/*.tsx"
      - "packages/**/tests/**/*.ts"
      - "packages/**/tests/**/*.tsx"
      - "plugins/*/*/tests/**/*.ts"

  - id: no-globalthis-fetch-mutation
    description: "Avoid mutating globalThis.fetch in tests; inject the fetch seam instead (ingestion `deps.fetch`, publish transports via KNOWLEDGE_KIT_PUBLISH_TRANSPORT=fake)."
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "globalThis\\.fetch\\s*="
    include:
      - "apps/**/tests/**/*.ts"
      - "apps/**/tests/**/*.tsx"
      - "packages/**/tests/**/*.ts"
      - "packages/**/tests/**/*.tsx"
      - "plugins/*/*/tests/**/*.ts"
  - id: no-xml-http-request
    description: "Do not use XMLHttpRequest in a Bun/Node codebase."
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "new\\s+XMLHttpRequest\\("
    # Correctness rule (not a seam rule): XHR is never valid under Bun, so it
    # applies to scripts/ tooling too — override the file-level apps+packages scope.
    include:
      - "apps/**/src/**/*.ts"
      - "packages/**/src/**/*.ts"
      - "plugins/*/*/src/**/*.ts"
      - "scripts/**/*.ts"

  - id: no-third-party-http-clients
    description: "Use the platform fetch / a project client instead of ad-hoc HTTP client libraries (axios/got/ky/ofetch/undici)."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "axios"
          - specifier: "got"
          - specifier: "ky"
          - specifier: "ofetch"
          - specifier: "undici"
        scope:
          include:
            - "apps/**/*.ts"
            - "packages/**/*.ts"
            - "plugins/*/*/**/*.ts"
            - "scripts/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/*.test.ts"
            - "**/dist/**"
            - "apps/cli/plugins/**"
