$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
# Runtime boundaries. Absorbed from ts-libs/.spur/rules/typescript/runtime-boundaries.yaml.
#
# SCOPE (fixed 2026-08-17): the product plugin tree lives at `plugins/<kind>/<name>/src/**`
# and MUST be covered — it is the bulk of knowledge-kit's runtime code. The previous
# `apps/**` + `packages/**` scope missed it entirely while accidentally matching
# `apps/cli/plugins/**`, the gitignored bundle-plugins.ts build artifact (a byte-copy of
# `plugins/`). That inverted the rule: it linted generated output and ignored the source.
# `apps/cli/plugins/**` is excluded everywhere below for that reason.
#
# `no-direct-process-env` is intentionally omitted — config-from-env is by design.
include:
  - "apps/**/src/**/*.ts"
  - "packages/**/src/**/*.ts"
  - "plugins/*/*/src/**/*.ts"
exclude:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/node_modules/**"
  - "**/dist/**"
  # Gitignored build artifact: bundle-plugins.ts copies plugins/ -> apps/cli/plugins/.
  - "apps/cli/plugins/**"

rules:
  - id: no-direct-process-spawn
    description: "Process execution must go through @gobing-ai/ts-runtime ProcessExecutor (or ts-ai-runner for agents). Sanctioned direct spawns are allowlisted below."
    severity: warning
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "node:child_process"
          - specifier: "child_process"
          - pattern: "Bun\\.(spawn|spawnSync)\\s*\\("
            matchMode: usage
          - specifier: "execa"
          - specifier: "zx"
        scope:
          include:
            - "apps/**/src/**/*.ts"
            - "packages/**/src/**/*.ts"
            - "plugins/*/*/src/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/*.test.ts"
            - "**/dist/**"
            - "apps/cli/plugins/**"
            # `knowledge-kit invoke` spawns plugin entries by design (ADR-006).
            - "apps/cli/src/invoke.ts"
            # STORM stages shell out to the `spur agent run` boundary — the sanctioned
            # agent seam per ADR-007 (LLM work is not a plugin kind). Injected via
            # StormStageRunner so tests never spawn.
            - "plugins/generations/content-gen/src/storm.ts"
            # `kind: 'file-cli'` publish transports shell out to a vendor CLI by design;
            # that IS their transport mechanism (docs/design publish spec).
            - "plugins/publishings/surfdash-pub/src/index.ts"
            - "plugins/publishings/zenn-pub/src/index.ts"
            # Ingest plugins whose transport IS a vendor CLI: horizon-ingest runs the
            # `uv run horizon` crawler, last30days-ingest runs last30days.py — same
            # vendor-CLI-boundary class as the publish/voice/web-search entries above.
            - "plugins/ingestions/horizon-ingest/src/index.ts"
            - "plugins/ingestions/last30days-ingest/src/index.ts"
            # HTML-to-text extraction shells out to a local binary before caching.
            - "plugins/ingestions/web-search/src/index.ts"
            # Optional WAV to MP3 transcode shells out to local ffmpeg binary.
            - "plugins/generations/voice-gen/src/mp3.ts"
            # Per-segment atempo speed-up shells out to local ffmpeg binary
            # (in-memory stdin/stdout) — same vendor-CLI class as mp3.ts above.
            - "plugins/generations/voice-gen/src/concat.ts"
            # image-gen providers whose transport is a local CLI by contract
            # (same class as file-cli transports + mp3.ts): codex-cli IS a wrapper
            # around the `codex` CLI (NEVER_AUTO, login-gated) and stages temp
            # wrapper/output files for it; google shells to curl only when a proxy
            # is set because Bun fetch drops long-lived proxied sockets (0115 port).
            - "plugins/generations/image-gen/src/providers/codex-cli.ts"
            - "plugins/generations/image-gen/src/providers/google.ts"
            # The stage executor's transport IS spawning the stages runner script
            # (spawnSync with inherited stdio, exit-code passthrough) — same
            # executor class as invoke.ts (ADR-006). ts-runtime itself blesses
            # direct spawnSync for sync contexts.
            - "apps/cli/src/stage.ts"
            # Voicebox auto-start spawns the app's server binary detached
            # (survives plugin exit) — vendor-app transport by contract, same
            # class as the file-cli/ffmpeg entries above.
            - "plugins/generations/voice-gen/src/voicebox-server.ts"

  - id: no-direct-fs-io
    description: "File IO must go through @gobing-ai/ts-runtime's FileSystem seam (createNodeFileSystem). Sync-structural sites are allowlisted below."
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - pattern: "from\\s+['\"]node:fs(?:/promises)?['\"]|require\\(['\"]node:fs"
            matchMode: usage
          - pattern: "\\bBun\\.(?:write)\\("
            matchMode: usage
        scope:
          include:
            - "apps/**/src/**/*.ts"
            - "packages/**/src/**/*.ts"
            - "plugins/*/*/src/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/*.test.ts"
            - "**/dist/**"
            - "apps/cli/plugins/**"
            # ── Sync-structural exemptions ──────────────────────────────────
            # The FileSystem interface returns `T | Promise<T>` unions, so every
            # consumer must be async. These four sites are synchronous by contract;
            # adopting the seam would force a breaking API change for no gain.
            #
            # `knowledge-kit invoke` reads/writes contract IO files around a
            # synchronous Bun.spawnSync plugin call (ADR-006).
            - "apps/cli/src/invoke.ts"
            # discoverPlugins/discoverAllPlugins are a synchronous public API in
            # kk-core consumed by the CLI; the seam would make plugin discovery async.
            - "packages/kk-core/src/registry.ts"
            # Module-scope package.json read for the CLI version banner.
            - "apps/cli/src/config.ts"
            # Single existsSync entry-point probe inside a sync Commander action.
            - "apps/cli/src/commands/plugin.ts"
            # Binary audio WAV buffer write for voice-gen generator plugin
            - "plugins/generations/voice-gen/src/index.ts"
            # image-gen binary byte-writer + reference-image reads (0107 R1): image
            # generation IS binary IO; the FileSystem seam is text-only, same class as
            # voice-gen/podcast-pub. All path maths routes through artifactPath, whose
            # stem/extension guards block path escape.
            - "plugins/generations/image-gen/src/bytes.ts"
            # codex-cli stages a temp wrapper + output file for the `codex` CLI and
            # needs access/mkdir/writeFile/rm around it — same vendor-CLI-transport
            # class as the spawn exclusion above (0115 port).
            - "plugins/generations/image-gen/src/providers/codex-cli.ts"
            # Binary audio bytes read for the presigned-URL PUT upload
            # (podcast-pub); the FileSystem seam is text-only.
            - "plugins/publishings/podcast-pub/src/index.ts"
            # surfdash-pub: sync existsSync probes in sync publish code, and binary
            # asset/cover copies via node:fs/promises (cp/copyFile) — the seam is
            # text-only, same class as podcast-pub. Sanctioned 2026-09-08 (sp fixall).
            - "plugins/publishings/surfdash-pub/src/index.ts"
            # stage.ts: sync-structural realpath/existsSync probes in sync stage-script
            # path resolution — same class as config.ts/plugin.ts (seam would force an
            # async API change for no gain).
            - "apps/cli/src/stage.ts"
            # voicebox-server: openSync log fd is handed to the detached spawn's stdio
            # — the seam is text-only and cannot produce an fd (same fd-transport class
            # as podcast-pub binary bytes).
            - "plugins/generations/voice-gen/src/voicebox-server.ts"
