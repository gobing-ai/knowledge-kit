$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
include:
  - "apps/**/src/**/*.ts"
  - "packages/**/src/**/*.ts"
exclude:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/node_modules/**"
  - "**/dist/**"

rules:
  - id: no-direct-process-spawn
    description: "Agent/process execution must go through ts-ai-runner / ts-runtime's ProcessExecutor. Sanctioned sites: `spur agent edit` opening $EDITOR and `knowledge-kit invoke` spawning plugin entries."
    severity: warning
    evaluator:
      type: rg
      config:
        pattern: "Bun\\.(spawn|spawnSync)\\s*\\("
    include:
      - "apps/**/src/**/*.ts"
      - "packages/**/src/**/*.ts"
    exclude:
      - "**/tests/**"
      - "**/*.test.ts"
      - "**/dist/**"
      - "apps/cli/src/commands/agent.ts"
      - "apps/cli/src/invoke.ts"

  - id: no-direct-fs-io
    description: "Prefer ts-runtime's FileSystem seam for fs IO. Light direct fs at app edges (service stat/access, migration loading) is allowlisted."
    severity: warning
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - pattern: "from\\s+['\"]node:fs(?:/promises)?['\"]|require\\(['\"]node:fs"
            matchMode: usage
          - pattern: "\\bBun\\.(?:write)\\("
            matchMode: usage
        scope:
          include:
            - "apps/**/src/**/*.ts"
            - "packages/**/src/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/*.test.ts"
            - "**/dist/**"
            # Sanctioned direct-fs sites (no local FileSystem seam re-implemented):
            - "packages/app/src/services/workflow-service.ts"
            - "packages/app/src/services/agent-service.ts"
            - "packages/domain/src/migrations.ts"
