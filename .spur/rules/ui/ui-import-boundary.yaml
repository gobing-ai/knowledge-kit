$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
# Disabled for knowledge-kit: no apps/web UI surface.
# Re-enable when apps/web exists.
rules:
  - id: ui-import-seam-only
    enabled: false
    description: >
      Third-party UI libraries may only be imported through apps/web/src/ui.ts.
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "daisyui"
          - specifier: "@uiw/react-md-editor"
        scope:
          include:
            - "apps/web/src/**/*.ts"
            - "apps/web/src/**/*.tsx"
          exclude:
            - "apps/web/src/ui.ts"
            - "**/tests/**"
            - "**/node_modules/**"

  - id: no-daisyui-class-leak
    enabled: false
    description: >
      daisyUI component classes must not appear outside apps/web/src/components/ui/.
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "className=[\"'][^\"']*\\b(btn|card|badge|modal|menu|navbar|drawer|tabs|alert|dropdown|collapse|join|tooltip|loading|select|checkbox|toggle)\\b"
    include:
      - "apps/web/src/**/*.tsx"
    exclude:
      - "apps/web/src/components/ui/**"
      - "apps/web/src/ui.ts"
      - "**/tests/**"
      - "**/node_modules/**"
