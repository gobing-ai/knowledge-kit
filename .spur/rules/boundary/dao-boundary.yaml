$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
# Store/DAO boundary rules — keep ts-db consumption centralized in packages/kk-store,
# drizzle confined to kk-store's schema authoring, and table DDL derived (not hand-written).
# Enforces ADR-030 (the kk store package owns SQLite) and the ADR-011 lineage: ts-db is
# consumed as a facade by DAO files only, and tables have a single source of truth.
#
# Retargeted from spur's `packages/domain` scaffold (task 0206 R8): the four rules below are
# scoped to `packages/kk-store`. spur's `no-hand-written-ddl-for-drizzle-tables` and
# `no-sql-text-imports` are NOT carried over — both guarded spur's domain DDL/`.sql`
# workflow, which this repo does not have (kk-store embeds its migrations, so
# `raw-sql-only-in-kk-store` is the substantive DDL guard). The
# `apps/cli/src/index.ts` ts-db exemption spur needed is dropped too: no app file imports
# ts-db here, so the exemption would only widen the hole.
rules:
  - id: ts-db-only-in-kk-store
    description: >
      @gobing-ai/ts-db may only be imported inside packages/kk-store. Apps, other
      packages and plugins consume persistence through the @gobing-ai/kk-store
      DAOs, never the raw adapter or a table definition. (ADR-030)
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "@gobing-ai/ts-db"
          - specifier: "@gobing-ai/ts-db/schema"
          - specifier: "@gobing-ai/ts-db/bun-sqlite"
          - specifier: "@gobing-ai/ts-db/d1"
        scope:
          include:
            - "apps/**/src/**/*.ts"
            - "packages/**/src/**/*.ts"
            - "plugins/**/src/**/*.ts"
          exclude:
            - "packages/kk-store/**"
            - "**/node_modules/**"
            - "**/tests/**"
            - "**/dist/**"

  - id: drizzle-only-in-kk-store-schema
    description: >
      drizzle-orm is an internal detail of the ts-db facade. It may be imported ONLY
      in packages/kk-store/src/schema/ (table authoring via defineTable column
      builders). DAOs, apps, plugins and other packages use the ts-db vocabulary
      (EntityDao/BaseDao + predicate spec), never drizzle. (ADR-011, ADR-030)
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "drizzle-orm"
          - specifier: "drizzle-orm/sqlite-core"
          - specifier: "drizzle-orm/bun-sqlite"
          - specifier: "drizzle-orm/d1"
          - specifier: "drizzle-zod"
        scope:
          include:
            - "apps/**/src/**/*.ts"
            - "packages/**/src/**/*.ts"
            - "plugins/**/src/**/*.ts"
          exclude:
            - "packages/kk-store/src/schema/**"
            - "**/node_modules/**"
            - "**/tests/**"
            - "**/dist/**"

  - id: tables-via-defineTable
    description: >
      Tables must be defined with defineTable() (from @gobing-ai/ts-db/schema), not
      bare sqliteTable() — so DDL and zod derive from one source. Allowed only under
      packages/kk-store/src/schema/ (where the store's five tables live). (ADR-030)
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "sqliteTable\\("
    include:
      - "apps/**/src/**/*.ts"
      - "packages/**/src/**/*.ts"
      - "plugins/**/src/**/*.ts"
    exclude:
      - "packages/kk-store/src/schema/**"
      - "**/node_modules/**"
      - "**/tests/**"
      - "**/dist/**"

  - id: raw-sql-only-in-kk-store
    description: >
      Raw SQL string literals (SELECT/INSERT/UPDATE/DELETE) must stay inside
      packages/kk-store (its DAOs, migrations and the lock/upsert statements the store
      owns). Apps, other packages and plugins query through @gobing-ai/kk-store DAOs —
      the store is the one place that knows the schema. (ADR-030)
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "(SELECT |INSERT INTO|UPDATE |DELETE FROM)"
    include:
      - "apps/**/src/**/*.ts"
      - "packages/**/src/**/*.ts"
      - "plugins/**/src/**/*.ts"
    exclude:
      - "packages/kk-store/**"
      - "**/node_modules/**"
      - "**/tests/**"
      - "**/dist/**"
