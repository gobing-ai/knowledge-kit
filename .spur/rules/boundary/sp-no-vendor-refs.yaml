$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
# Disabled for knowledge-kit: no plugins/sp package in this repo.
# Re-enable if a plugins/sp surface is added.
include:
  - "plugins/sp/**/*.md"
  - "plugins/sp/**/*.yaml"
  - "plugins/sp/**/*.yml"
  - "plugins/sp/**/*.json"
  - "plugins/sp/**/*.ts"
exclude:
  - "**/node_modules/**"
  - "plugins/sp/tests/**"
rules:
  - id: sp-no-vendor-refs
    enabled: false
    description: >
      Do not reference a `vendors/` path from inside plugins/sp.
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "vendors/"
