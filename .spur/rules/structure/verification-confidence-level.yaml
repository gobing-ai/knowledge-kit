$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
# Verification blocks must close with a HIGH|MEDIUM|LOW confidence level, and the level must be EARNED.
#
# The changelog procedure (sp-dev-changelog → dev-operations.md §8 step 7) closes every emitted
# section with `Verification: HIGH|MEDIUM|LOW — …` plus a `Confidence:` line, and the upstream
# task-verification surface wants the same enum on verify answers (spur-new 1068). Nothing checked
# it on the artifact this repo actually writes: CHANGELOG.md carried `Confidence: HIGH` as
# hand-written prose, so a section could ship with the line missing or misspelled and no gate would
# notice — the same failure mode as a judge verdict whose `confidence` field is absent, which the
# verdict gates and `plugins/kk/tests/verdict-confidence.test.ts` already refuse.
#
# The enum alone is not enough: a block could claim HIGH while citing nothing at all, which is the
# close-out equivalent of a PASS without evidence. So the checker also requires the level to be earned
# — HIGH must cite (`path:line`, a repo path with a code/doc extension, or an http(s) URL), and
# MEDIUM/LOW must either cite or name what is unverified, so a low-confidence close-out states its gap
# instead of asserting nothing. The falsification cases live in
# `verification-confidence-level.test.sh` (9 cases: a HIGH without citations and a low level with
# neither citation nor gap must both fail).
#
# Scope, two sets. (1) every markdown document that claims a `Verification (` block (today
# CHANGELOG.md); (2) the verification records the pipeline itself writes — docs/tasks/** and
# docs/features/** — where `spur task record` closes a task's `## Testing` with
# `- Confidence: HIGH|MEDIUM|LOW`. A record's claimed level must be in the enum and, inside
# `## Testing`, earned the same way (HIGH cites; MEDIUM/LOW cite or name what is unverified). Record
# PRESENCE is not enforced: 155 of the repo's 204 verdict-carrying done tasks predate the practice, so
# the rule judges what a record claims, not whether it claims. The checker lives in `verification-confidence-level.sh` so its file/line detail is
# reachable by hand — the `exit-code` evaluator reports only the exit status.
#
# SCOPE NOTE: `include` does not scope an `exit-code` rule — the evaluator runs whether or not the
# globs match (measured 2026-10-12: an `include` that matched nothing still executed), so the checker's
# own discovery owns the scope and these globs are documentation. Do not narrow them expecting effect.
rules:
  - id: verification-block-carries-confidence-level
    description: "Every `Verification (` block in a repo document carries exactly one `Confidence: HIGH|MEDIUM|LOW` line and earns it, and every level claimed anywhere — including the `## Testing` record `spur task record` writes — is inside the enum and, in a verification record, earned: HIGH cites evidence (`path:line`, a repo path, or a URL), MEDIUM/LOW either cites evidence or names what is unverified. A close-out or a task record therefore cannot misspell or unsupportedly claim its confidence level."
    severity: error
    evaluator:
      type: exit-code
      config:
        command: sh
        args:
          - ".spur/rules/structure/verification-confidence-level.sh"
        message: "exit {code}: a verification record or `Verification (` block claims a confidence level outside HIGH|MEDIUM|LOW, omits the line from its block, or claims a level it does not earn (a HIGH with no citation, or a MEDIUM/LOW that cites nothing and names no gap) — run `sh .spur/rules/structure/verification-confidence-level.sh` for the file and line, and `sh .spur/rules/structure/verification-confidence-level.test.sh` for the cases"
    include:
      - "CHANGELOG.md"
      - "docs/**/*.md"
    exclude:
      - "**/node_modules/**"
      - "**/vendors/**"
