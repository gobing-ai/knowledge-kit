$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
# A verification ANSWER artifact that asserts a verdict must declare an earned HIGH|MEDIUM|LOW.
#
# The other confidence surfaces already have a gate: the `Verification (` block and the `## Testing`
# record (`verification-block-carries-confidence-level`), the durable verdict artifact
# (`durable-verdict-carries-confidence-proof`), the verdict artifact
# (`verdict-artifact-asserts-confidence-level`), and the API/library claim table
# (`api-library-claim-cites-source-and-confidence`). The ANSWER artifact the verify stage writes under
# `.spur/run/` had none. Measured in this repo on 2026-10-12: of 167 `*-verify-answer.txt` only 53
# carried a `Confidence:` line — so an answer could assert `Verdict: PASS` with no level, or a level
# outside the enum, and no gate noticed. `spur task verdict` lints the verify grammar at write time,
# but nothing re-read the file, and a hand-written or agent-written answer bypasses that lint
# entirely.
#
# EXTENDED 2026-10-12 to the REVIEW answer. The review plane was excluded at first (6 of 45 carried a
# level) because the review-stage contract declared priority cells only, so demanding a level would
# have failed a compliant reviewer artifact. That contract changed — the sp plugin's reviewer
# (`plugins/sp/agents/super-reviewer.md`, spur-new `78cf054e`) now requires exactly one
# `Confidence: HIGH | MEDIUM | LOW` line with the same earning rule — so the same concern over one more
# glob became this rule's scope instead of a second rule covering it (the rule-authoring doctrine
# classifies that as EXTEND, not ADD). The rule ID keeps its original `verification-answer` name: rule
# ids are never renamed, and the narrower id is the price.
#
# Two construction decisions, both deliberate:
#   * PRESENCE IS NEVER REQUIRED — `.spur/run/` is a disposable plane (ADR-131), so demanding an
#     answer file would fail after any cleanup. The rule judges the files that exist: a verdict-bearing
#     answer must declare and earn its level. Empty files and files with no verdict line are out of
#     scope.
#   * A CUTOFF, NOT A BACKLOG — the sibling rule grandfathers pre-rule debt in an explicit list; that
#     list is unusable for a plane with ~218 answer files and growing every run. Answers older than the
#     adoption instant are reported as one debt count and not judged, so the rule is green on history
#     and enforces from adoption onward. The instant is `2026-10-12T04:00:00Z` — the checker header
#     records how it was chosen. `--no-since` exposes the full pre-rule set.
#
# The checker lives in verification-answer-confidence-level.sh so its file/line detail is reachable by
# hand — the `exit-code` evaluator reports only the exit status. Its 19 falsification cases live in
# verification-answer-confidence-level.test.sh.
#
# SCOPE NOTE: `include` does not scope an `exit-code` rule — the evaluator runs whether or not the
# globs match (measured 2026-10-12: an `include` that matched nothing still executed), so the checker's
# own discovery owns the scope and these globs are documentation. Do not narrow them expecting effect.
rules:
  - id: verification-answer-carries-confidence-level
    description: "Every `.spur/run/` answer artifact that asserts a `Verdict:` — a `*-verify-answer.txt` from the verify stage or a `*review-answer*.txt` from the review stage — declares exactly one `Confidence: HIGH|MEDIUM|LOW` line and EARNS it: HIGH cites an http(s) URL, a `path:line`, or a repo path with a code/doc extension; MEDIUM/LOW cite the same or name what is unverified. A level outside the enum, a missing level, or an unearned level is refused. Absent, empty and verdict-free answers are out of scope, as are answers older than the 2026-10-12T04:00Z adoption cutoff (reported as debt)."
    severity: error
    evaluator:
      type: exit-code
      config:
        command: sh
        args:
          - ".spur/rules/structure/verification-answer-confidence-level.sh"
        message: "exit {code}: a verification answer asserts a verdict without exactly one earned HIGH|MEDIUM|LOW level — run `sh .spur/rules/structure/verification-answer-confidence-level.sh` for the file and line, `--no-since` for the pre-rule set, and `sh .spur/rules/structure/verification-answer-confidence-level.test.sh` for the cases"
    include:
      - ".spur/run/**/*-verify-answer.txt"
      - ".spur/run/**/*review-answer*.txt"
    exclude:
      - "**/node_modules/**"
