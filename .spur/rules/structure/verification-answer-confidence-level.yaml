$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
# A verification ANSWER artifact that asserts a verdict must declare an earned HIGH|MEDIUM|LOW.
#
# The other three confidence surfaces already have a gate: the `Verification (` block and the
# `## Testing` record (`verification-block-carries-confidence-level`), the durable verdict artifact
# (`durable-verdict-carries-confidence-proof`), and the API/library claim table
# (`api-library-claim-cites-source-and-confidence`). The answer artifact the verify and review stages
# write under `.spur/run/` had none. Measured in this repo on 2026-10-12: of 167
# `*-verify-answer.txt` only 53 carried a `Confidence:` line, and of 45 `*review-answer*` only 6 — so
# an answer could assert `Verdict: PASS` with no level, or a level outside the enum, and no gate
# noticed. `spur task verdict` lints the verify grammar at write time, but nothing re-read the file,
# and a hand-written or agent-written answer bypasses that lint entirely.
#
# Two construction decisions, both deliberate:
#   * PRESENCE IS NEVER REQUIRED — `.spur/run/` is a disposable plane (ADR-131), so demanding an
#     answer file would fail after any cleanup. The rule judges the files that exist: a verdict-bearing
#     answer must declare and earn its level. Empty files and files with no verdict line are out of
#     scope.
#   * A CUTOFF, NOT A 212-ENTRY BACKLOG — the sibling rule grandfathers pre-rule debt in an explicit
#     list; that list is unusable for a plane with 212 files and growing every run. Answers older than
#     2026-10-12 are reported as one debt count and not judged, so the rule is green on history and
#     enforces from adoption onward. `--no-since` exposes the full pre-rule set.
#
# The checker lives in verification-answer-confidence-level.sh so its file/line detail is reachable by
# hand — the `exit-code` evaluator reports only the exit status. Its 15 falsification cases live in
# verification-answer-confidence-level.test.sh.
rules:
  - id: verification-answer-carries-confidence-level
    description: "Every `.spur/run/` verification answer that asserts a `Verdict:` declares exactly one `Confidence: HIGH|MEDIUM|LOW` line and EARNS it: HIGH cites an http(s) URL, a `path:line`, or a repo path with a code/doc extension; MEDIUM/LOW cite the same or name what is unverified. A level outside the enum, a missing level, or an unearned level is refused. Absent, empty and verdict-free answers are out of scope, as are answers older than the 2026-10-12 adoption cutoff (reported as debt)."
    severity: error
    evaluator:
      type: exit-code
      config:
        command: sh
        args:
          - ".spur/rules/structure/verification-answer-confidence-level.sh"
        message: "exit {code}: a verification answer asserts a verdict without exactly one earned HIGH|MEDIUM|LOW level — run `sh .spur/rules/structure/verification-answer-confidence-level.sh` for the file and line, `--no-since` for the pre-rule set, and `sh .spur/rules/structure/verification-answer-confidence-level.test.sh` for the cases"
    include:
      - ".spur/run/**/*-verify-answer.txt"
      - ".spur/run/**/*review-answer*.txt"
    exclude:
      - "**/node_modules/**"
