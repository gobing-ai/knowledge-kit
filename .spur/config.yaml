# Spur project configuration for knowledge-kit
# Generated by `spur init`; upgraded to schema 1.2 (bundled workflows; stock workflow YAMLs resolve from the package, not .spur/workflows).

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1.2"
name: knowledge-kit

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Scheduler jobs invoke the installed `spur` CLI (always the latest global install — never pin) — this project has no
# repo-local spur source, so the global install is the canonical binary.
bootstrap:
  # ── Board contribution modules (G8/0255) ──
  # The three native KK workflow modules, declared enabled because the assets are guaranteed to
  # exist: the host validates each `directory` at server start, and `apps/cli/dist/board` is a
  # gitignored build tree, so the root `prepare` script builds it on every `bun install` (CI's
  # `--ignore-scripts` install is covered by its own explicit `bun run build`).
  # A checkout that skipped lifecycle scripts or ran `git clean -xdf` needs one
  # `bun scripts/build-board.ts` before `spur serve`, else the host refuses to start with
  # "module directory ... was not found"; declaration and build wiring are pinned by
  # scripts/tests/board-package.test.ts. See docs/04_DESIGN.md `kk board`.
  modules:
    - id: kk-collect
      name: Collect
      icon: "📥"
      enabled: true
      type: react
      directory: apps/cli/dist/board/collect
      entry: index.js
      styles: [index.css]
    - id: kk-daily-ai-voice2
      name: Daily AI Voice
      icon: "🎙️"
      enabled: true
      type: react
      directory: apps/cli/dist/board/daily-voice
      entry: index.js
      styles: [index.css]
    - id: kk-itc
      name: IT Content
      icon: "✍️"
      enabled: true
      type: react
      directory: apps/cli/dist/board/itc
      entry: index.js
      styles: [index.css]
  logging:
    enabled: true
    level: info
    console: false
    json: true
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    # true, not false (2026-11-15, task 0373): commit 6a1713ea turned the tick loop off, but the
    # running server kept scheduling anyway, so the flag only documented a behaviour that was not
    # real. These jobs are the production kk news schedule; the flag now says so.
    enabled: true
    # Periodic executions live here and nowhere else (task 0750). A tick
    # enqueues `scheduler.custom`, which the server's job worker runs through
    # /bin/sh -c in the project root. Use the repo-local CLI, never a global
    # `spur` that may be a stale bundle (AGENTS.md history-validation rule).
    jobs:
      # Incremental refresh, waking hours only (07:00-23:50; the cron hour range
      # keeps 00:00-06:59 quiet). `history daily` = import + analyze; analyze is
      # what refreshes the Board History rollups (token usage included) - import
      # alone never does. Split into explicit commands so a failing import never
      # masks a skipped analyze.
      #
      # 30-min cadence, not 10 (2026-10-13): the I81 "no-op tick is cheap"
      # assumption no longer holds - analyze is history-wide and the importer commits a
      # transaction per JSONL line, so on a loaded machine (load 32 from parallel agent
      # batches) a tick measured 18 min import (1996 new messages) + >20 min analyze.
      # At 10 min it ran back-to-back and every other tick was silently suppressed (the
      # queue_jobs_history_refresh_active_unique index and/or the in-process duplicate guard —
      # no event is emitted either way); at 30 min a long tick just defers the next one, and
      # checkpoint resume self-heals the gap.
      - name: history-refresh
        cron: "*/30 7-23 * * *"
        # 60 min: the 600s default killed every long tick (all 489 failures in this job's
        # history are "timed out after 600000ms", 601-614s durations). Measured 2026-10-13:
        # quiet chain 68-310s import + 60-1124s analyze; loaded chain 1080s import +
        # ~1200s analyze, which still overran a first attempt at 2400000ms.
        timeoutMs: 3600000
        command: spur --no-logo history import && spur --no-logo history analyze

      # 08:15 daily (moved from 05:03 on 2026-11-18): full-corpus import
      # (checkpoint resume self-heals gaps), then the twelve-section
      # history-anatomy diagnostic report headless. On a cache hit the
      # workflow skips the token-expensive model stages and republishes
      # provenance (ADR-079), so a ready report costs no tokens.
      # Ends with database maintenance (PRAGMA optimize + wal_checkpoint).
      #
      # Why 08:15 and not 05:03: one job worker serialises every job, and the
      # 04:30 voice run needs ~2.6 h (audio alone ~2 h) — on 11-18 it ran
      # 04:30-07:06 and this job, queued at 05:03, only started at 07:06:29,
      # starving the */30 7-23 refresh ticks and sitting in front of the 07:00
      # overseas-rss publish, which does have a deadline. 08:15 is after the
      # measured generate finish (06:30-07:10), after that publish window, and
      # after the 07:00/07:30 refresh ticks. The report has no deadline
      # (16-18 min on a cache hit, up to ~4.5 h cold). 02:00 is not an option:
      # the daily window would be nearly empty (measured 11-18 durations from
      # queue_jobs: kk-daily-ai-voice 156 min, history report 16-270 min).
      - name: history-daily-report
        cron: "15 8 * * *"
        # 3h: every run since creation (33/33) died on the 600s default, because
        # full-corpus import alone costs ~310s and the workflow adds agent stages.
        # Raised 2h->3h 2026-11-06: worst-case import ~18m + wide analyze legs ~38m
        # + two correct passes + validate ~20m risks clipping a 2h budget.
        # stepTimeoutMs: enrich on pi-dsv4.1-flash-volc crossed the shipped 60m
        # step cap from 10-24 onward (10 straight enrich deletions at exactly
        # 3600.000s); 90m clears the actual 2026-11-07 measure (13m43s) with headroom.
        # __executor.reviewer: reviewed stages (enrich/correct/validate, all role
        # reviewer) were pinned from flash (standard) to agy-gemini (capable-1,
        # gemini-3.8-flash-high) after the 2026-11-07 run f91131fa — enrich OK at
        # 13m43s but validate FAIL -> correct x2 (19m34s + 9m49s) -> still FAIL ->
        # retry-exhausted. Pin advertises in vars (parsed as {name}); no workflow edit.
        #
        # 2026-11-18: this job had been failing since 11-12 (and failing enrich on
        # 11-08) with `agent.run 'enrich' (agy-gemini) exited with code 3` after
        # 2-3ms and empty stdout/stderr. That signature is `agy` NOT LOGGED IN, not
        # a workflow bug: agy's own log says "You are not logged into Antigravity",
        # print mode's silent auth fails, and the OAuth prompt cannot complete in a
        # headless child. The pin makes an auth outage fatal for the whole report,
        # so check it first:
        #   agy -p OK --mode text        # prints an OAuth URL; complete it in a browser
        #   agy models                   # exits 0 only once the login is live
        # Spur has no auth probe (`spur agent doctor` reports the BINARY, not the
        # login), so this comment is the only preflight there is. `agy models` is
        # the job's first command for that reason: an outage fails in a second with
        # "Please sign in to view available models" instead of a code-3 mystery.
        #
        # The PATH export is the second half of the same outage class: `agy` lives in
        # ~/.local/bin, which is NOT on this server's PATH (/Users/robin/.bun/bin:
        # /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin), and `spur agent run --agent
        # agy-gemini` then answers "Agent 'antigravity-cli' is not installed or not
        # runnable" — the same silently-dead executor from the other direction.
        #
        # FAILOVER, not a second pin (2026-11-18): the probe now CHOOSES the pin. Spur
        # has no failover for a live-but-dead executor — `resolveRole`'s checkUsable is
        # install+version only, and DoctorRunner hardcodes probeAuth:false — so a pin
        # to a logged-out CLI kills the run at its first agent stage. Its one built-in
        # re-roll is for a DISABLED pin, and nothing marks an auth outage disabled.
        # `grok-4.7` is the fallback because it is the next enabled capable native pair
        # (capable-2) and probed alive on 11-18; `pi-sol` (capable-2) probed dead the
        # same day. Both stay honest: this job still prefers agy-gemini's capable-1
        # native gemini when it answers.
        timeoutMs: 10800000
        command: >-
          export PATH="$HOME/.local/bin:$PATH" &&
          if agy models >/dev/null 2>&1; then R=agy-gemini; else R=grok-4.7; fi &&
          spur --no-logo history import --source all &&
          spur --no-logo workflow run config/workflows/history-anatomy.yaml --quiet
          --vars "{\"stepTimeoutMs\":\"5400000\",\"__executor.reviewer\":\"{\\\"name\\\":\\\"$R\\\"}\"}" &&
          spur --no-logo self maintain

      # 04:30 daily: kk-daily-ai-voice2 end-to-end over the kk store (extract →
      # plan → article/cover/script → nested safety gate → audio → publish
      # surfdash + podcast → soft channels → ledger). It supersedes
      # kk-daily-ai-voice.yaml (design docs/design/kk-collect-and-daily-voice2.md
      # §8 cut-over): the store, not an in-run ingest fan-in, is its source, so
      # this job no longer collects. Morning results (episode audio, show notes,
      # run report) land in .works/kk-daily-ai-voice2/<date>/. Voice-gen runs
      # against hosted Gemini TTS (vdriver=gemini, the workflow default —
      # GEMINI_API_KEY + GEMINI_TTS_MODEL live in ~/.config/kk/config.yaml's
      # gemini-tts env block; a 1-segment smoke render took 23s on 2026-10-10).
      # No local Voicebox server is involved: the gemini client is a
      # clientOverride path, so voice-gen's local-server auto-start never fires.
      # cover_enabled stays at its workflow default (true, minimax/image-01).
      #
      # The command is one verb (0369 consolidation): `kk news generate --publish` owns the
      # production flags (browser channel, the 72h window, the executor pair, the works root
      # and the internal deadline) instead of a launcher script, so the cron line and a local
      # run are the same code path. Executor-pair history (why a retry must be a different
      # binary family, the 11-08 volc switch, the 11-10 quota death and 0347 F1 preflight)
      # lives with the workflow's executor vars.
      #
      # 04:30 and not 06:00, because the pool must already be in the store:
      # `kk store extract` only sees what the preceding 04:00 kk-collect tick has
      # ingested AND labeled. Measured kk-collect durations (runs table,
      # 2026-10-08..10-10): 8 scheduled ticks avg 9.4 min, max 15.3; the two 04:00
      # ticks were the fast ones at 4.8 and 5.5 min (collect 253s/308s + label
      # 19-33s, store ready by 04:05); across all 14 recorded runs the worst was
      # 16.8 min. A pathological 04:00 tick would therefore still finish by
      # ~04:17, so 04:30 clears the observed worst case by ~13 min while handing
      # the run a fresh pool (extract window 24h against a 6h collect cadence).
      - name: kk-daily-ai-voice
        cron: "30 4 * * *"
        # 6h, not 4h (2026-11-15, measured): a real 2026-11-15 run needed >3h45m and was killed by
        # the launcher's own deadline one section short of a bundle. At ~17 min per voiced section
        # the TTS alone costs ~3h, before ~16 min of safety and the render/combine steps.
        timeoutMs: 21600000
        # --agent pinned 2026-11-15 (task 0373): the cost-first ladder resolves to a free
        # executor that dies at dispatch — opencode `-free` returns "Invalid credential",
        # agy-gemini needs an expired Google login, and pi-dsv4.1-flash-volc is 429 until
        # 2026-11-18. pi-dsv4.1-flash-cc answered a probe on this host, so pin it rather than
        # let every 04:30 tick fail in the executor probe.
        # --skip-review (2026-11-15): the workflow's `review` node is `pause: true` unless
        # skip_review=true, so an unattended 04:30 run stopped there and the launch recorded
        # "workflow paused: kk-news-generate -> review" as a failure. The retired launcher passed
        # the same switch as vars.skip_review=true. The safety machine still runs; this skips the
        # editorial approval pause, not a gate.
        command: kk news generate --publish --skip-review --agent pi-dsv4.1-flash-cc
      # Morning runs stay draft-only (ADR-022: live is launch-only) — podcast-pub items land
      # microfeed-unpublished and are invisible on podcast.salty.vip until go-live. Operator
      # routine mid-morning: `kk news publish --window after-generate --live-channels
      # surfdash-pub,podcast-pub`, then approve the send-confirm pause with `spur workflow
      # continue` (surfdash publishes publicly in draft, podcast does not — 2026-11-10 lesson:
      # the episode stayed hidden all day).

      # 07:00 daily: the `overseas-rss` window (design content-pipeline-consolidation §5a) — X/Threads
      # overseas targets behind the podcast RSS gate. `kk news publish` owns the cron-safe LA date
      # math: overseas reads YESTERDAY's generation bundle, per R1. Unattended-safe because every
      # overseas row is dummy/off in the pinned daily-ai-voice preset — no live row means the
      # send-confirm pause never fires.
      #
      # --unattended (2026-11-12 consolidation) implements the second trigger (operator request
      # 2026-11-05) that used to be an inline case/jq shell here: if today's voice3 receipt is
      # missing or a hard failure (failed/timed-out/interrupted — NOT 'running', the 04:30 job can
      # legally still be executing until ~08:30, and a duplicate run would fight it for the store
      # lock), re-run the generation first with the same flags as the 04:30 job (one definition,
      # the verb), then publish either way — receipts make the window a no-op for what is already
      # delivered, and a gated miss is diagnosed, not silently dropped.
      # 6h timeout = one 3h45m retrigger budget plus the window.
      - name: kk-daily-publish3
        cron: "0 7 * * *"
        timeoutMs: 21600000
        command: kk news publish --window overseas-rss --unattended --agent pi-dsv4.1-flash-cc

      # 17:00 local daily: the `cn-peak` window (design content-pipeline-consolidation §5a) — the
      # domestic rows with no draftable rail (微博 头条文章). 17:00 America/Los_Angeles is 09:00
      # Asia/Shanghai in PST and 08:00 in PDT, so the window's own `wait-until 09:00 Asia/Shanghai`
      # node sleeps at most 1h and the entry never needs editing twice a year. Until 2026-11-12 this
      # entry did not exist: the preset's cn-peak rows were live but nothing ever fired the window,
      # so the 微博 article only published when an operator launched it by hand (the 11-12 run at
      # 16:53 local was exactly that).
      # Re-enabled 2026-11-15 (it was paused only for the day the generation overran into 17:00).
      - name: kk-daily-publish3-cn-peak
        cron: "0 17 * * *"
        timeoutMs: 21600000
        command: kk news publish --window cn-peak --unattended --agent pi-dsv4.1-flash-cc

      # 04:05, 10:05, 16:05, 22:05 daily: kk-collect standalone 6-hourly collection
      # into the kk store (aihot + last30days + horizon -> store ingest -> label).
      # :05 and not :35 (2026-10-18): the 04:30 kk-daily-ai-voice run reads the pool this job
      # writes, so a :35 tick lands five minutes AFTER that run and leaves it a 6.5h-stale store
      # (a separately installed launchd plist, 04:00, is the other feeder and was skipped as
      # "service inactive" today). Measured collect 4.8-15.3 min, so :05 lands by ~04:20 either way;
      # the launchd :00 tick and this one serialize on `kk store lock`, so the second of the pair skips.
      - name: kk-collect
        cron: "5 4,10,16,22 * * *"
        timeoutMs: 14400000
        command: spur --no-logo workflow run plugins/kk/workflows/kk-collect.yaml --quiet

      # 04:00 Sunday weekly: deep database maintenance (VACUUM defragmentation +
      # page compaction, PRAGMA optimize, and WAL checkpoint truncation).
      - name: database-weekly-maintenance
        cron: "0 4 * * 0"
        command: spur --no-logo self maintain --vacuum

rules:
  paths:
    - .spur/rules/**/*.yaml

# workflows:
#   paths:
#     - .spur/workflows/

redaction:
  enabled: false

# ── Release (spur builder bump-ver / drop-tags) ──
# Release plumbing knobs consumed by `spur builder bump-ver` / `drop-tags`
# (wired as the bump-ver / drop-tags package scripts). `bun run bump-ver <version> --push`
# releases the CLI. `aggregatePackage` below names the published package, so the *bare*
# `spur builder bump-ver <version> --push` form also pushes the scoped trigger tag
# @gobing-ai/knowledge-kit-v<version> that .github/workflows/publish.yml consumes.
# Without it (spur < 0.3.83 ignores the key — the pinned scripts still work) a targetless bump
# would touch only the `workspace:`-pinned private packages and tag the aggregate
# `knowledge-kit-v<version>` (the root package name), which no workflow consumes.
# Values match the built-in defaults; adjust here instead of patching release code when
# conventions change.
builder:
  # The bun preset resolves `check-feature` to `bun run spur-check-feature`, which now exists as an
  # alias of the repo-wide gate (spur's feature-lifecycle FSM runs it when a feature enters
  # `verifying`, ADR-142). The pin stays explicit so a future preset change cannot silently repoint
  # feature completion at a narrower command.
  actions:
    check-feature: bun run spur-check
    # The light gate's changed-file check. Biome cannot process Markdown and skips gitignored
    # paths, so a docs-only change set left it with nothing to check and it exited 1 with "No files
    # were processed" — every docs-only task was ungateable (task 0383). The wrapper filters to the
    # languages Biome handles and passes `--no-errors-on-unmatched`, so "nothing to check" is a pass
    # while a real finding still fails the gate.
    lint-changed: bun scripts/lint-changed.ts {files}
    # The changed-scope test run. Bound so its coverage goes to a scratch directory: the light gate's
    # own run otherwise overwrote the repo-wide `.coverage/lcov.info` with one workspace's numbers, and
    # the NEXT gate's coverage rule then failed every file that run had not touched (task 0383).
    test-changed: bun scripts/test-changed.ts {workspace} {paths}
  bump-ver:
    # Needs spur >= 0.3.83 (released 2026-09-16); older spur silently ignores the key.
    aggregatePackage: knowledge-kit
    tagVersionSeparator: "-v"
    publishWorkflow: publish.yml
    releaseCommitType: chore
    releaseCommitScope: release
    ghRunListLimit: 5
    # Version carriers beyond the built-ins (workspace package.json; marketplace + entry
    # plugin.json). None needed here — the built-ins already cover superskill-facing
    # staleness detection. Registry: apps/cli/src/version-carriers.ts (in spur-new).
    versionCarriers: []

# ── Planning (design §2.1 / §9) ──
tasks:
  active: docs/tasks
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary

features:
  dir: docs/features

# Machine-wide default: bundled workflows shipped in the installed package.
# TODO: switch to `- bundled:workflows` once the installed spur carries
# BUNDLED_PATH_PREFIX expansion (monorepo config/config.global.yaml + workflow.ts);
# 0.3.61 predates it and would list nothing.
# Repository workflows are discovered through .spur/workflows -> ../plugins/kk/workflows.
workflows:
  paths:
    - /Users/robin/node_modules/@gobing-ai/spur/config/workflows/

# ── Decisions (ADR-134) ──
# The kk item-label catalog, served to `kk store label` through `spur decision run`
# (design kk-collect-and-daily-voice2.md §4). Project-relative, so the paths resolve
# from the repo root on any checkout.
#
# The installed package's own catalogs (task-pipeline's task-triage / failure-class /
# review-failure-class, gates, idea-pipeline, ...) load automatically as the SHARED layer
# (`spur decision status` → layers.shared). Do not list that folder here: an entry in this list
# is a REGISTERED layer, which outranks shared, so an absolute path into the installed package
# re-registers the same files and lets a stale copy shadow newer bundled catalogs. (Removed
# 2026-10-19; it was a workaround from spur 0.4.2, before the shared layer existed.)
decisions:
  paths:
    - plugins/kk/decisions
  maker: fm-local
  makers:
    # 2026-10-21: fm-local is primary again — the operator accepted the Apple Foundation Models CLI
    # licence (09:46 local; `fm license --status` → "Agreed to license FM1 version 1.0"). The
    # typesafe detour earlier that day existed only because every unlicensed ask answered
    # `no-backend` and `kk-item-category` then fell back to `non-ai` for EVERY item, which emptied
    # the ai-news pool. Keep the four decisions named explicitly so an unlicensed machine fails
    # visibly here instead of silently starving the pool.
    kk-item-category: fm-local
    kk-item-importance: fm-local
    kk-item-urgency: fm-local
    kk-item-impact: fm-local
    # Restored to laya-local 2026-10-19 (task 0317 R5): spur 0.4.17 ships `worker/laya_worker.py`
    # (spur-new 1262), and `spur decision run kk-item-quality` answers `maker: laya-local,
    # reason: accepted` in ~1s. Before 0.4.17 every ask failed with `reason: error` in ~20ms.
    kk-item-quality: laya-local
    kk-item-china-politics: typesafe
    kk-item-sensitivity: typesafe
    kk-item-audience: typesafe
    # kk-item-sensitivity routes to typesafe; score positions are rounded to nearest level (task 0240).
