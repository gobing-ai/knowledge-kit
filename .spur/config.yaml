# Spur project configuration for knowledge-kit
# Generated by `spur init`; upgraded to schema 1.1 (ADR-033 executor tiers + planning blocks).

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1.1"
name: knowledge-kit

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
bootstrap:
  logging:
    enabled: true
    level: info
    console: false
    json: true
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: false

# ── Spur app section (validated by spurConfigSchema in @gobing-ai/spur-config) ──
agent:
  default: pi

rules:
  paths:
    - .spur/rules/**/*.yaml

workflows:
  paths:
    - .spur/workflows/

redaction:
  enabled: false

# ── Planning (design §2.1 / §9) ──
tasks:
  active: docs/tasks
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary

features:
  dir: docs/features
