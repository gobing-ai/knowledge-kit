# Spur project configuration for knowledge-kit
# Generated by `spur init`; upgraded to schema 1.2 (bundled workflows; stock workflow YAMLs resolve from the package, not .spur/workflows).

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1.2"
name: knowledge-kit

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Scheduler jobs invoke the installed `spur` CLI (always the latest global install — never pin) — this project has no
# repo-local spur source, so the global install is the canonical binary.
bootstrap:
  # ── Board contribution modules (G8/0255) ──
  # The three native KK workflow modules, declared enabled because the assets are guaranteed to
  # exist: the host validates each `directory` at server start, and `apps/cli/dist/board` is a
  # gitignored build tree, so the root `prepare` script builds it on every `bun install` (CI's
  # `--ignore-scripts` install is covered by its own explicit `bun run build`).
  # A checkout that skipped lifecycle scripts or ran `git clean -xdf` needs one
  # `bun scripts/build-board.ts` before `spur serve`, else the host refuses to start with
  # "module directory ... was not found"; declaration and build wiring are pinned by
  # scripts/tests/board-package.test.ts. See docs/04_DESIGN.md `kk board`.
  modules:
    - id: kk-collect
      name: Collect
      icon: "📥"
      enabled: true
      type: react
      directory: apps/cli/dist/board/collect
      entry: index.js
      styles: [index.css]
    - id: kk-daily-ai-voice2
      name: Daily AI Voice
      icon: "🎙️"
      enabled: true
      type: react
      directory: apps/cli/dist/board/daily-voice
      entry: index.js
      styles: [index.css]
    - id: kk-itc
      name: IT Content
      icon: "✍️"
      enabled: true
      type: react
      directory: apps/cli/dist/board/itc
      entry: index.js
      styles: [index.css]
  logging:
    enabled: true
    level: info
    console: false
    json: true
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: true
    # Periodic executions live here and nowhere else (task 0750). A tick
    # enqueues `scheduler.custom`, which the server's job worker runs through
    # /bin/sh -c in the project root. Use the repo-local CLI, never a global
    # `spur` that may be a stale bundle (AGENTS.md history-validation rule).
    jobs:
      # Incremental refresh, waking hours only (07:00-23:50; the cron hour range
      # keeps 00:00-06:59 quiet). `history daily` = import + analyze; analyze is
      # what refreshes the Board History rollups (token usage included) - import
      # alone never does. Split into explicit commands so a failing import never
      # masks a skipped analyze.
      #
      # 30-min cadence, not 10 (2026-10-13): the I81 "no-op tick is cheap"
      # assumption no longer holds - analyze is history-wide and the importer commits a
      # transaction per JSONL line, so on a loaded machine (load 32 from parallel agent
      # batches) a tick measured 18 min import (1996 new messages) + >20 min analyze.
      # At 10 min it ran back-to-back and every other tick was silently suppressed (the
      # queue_jobs_history_refresh_active_unique index and/or the in-process duplicate guard —
      # no event is emitted either way); at 30 min a long tick just defers the next one, and
      # checkpoint resume self-heals the gap.
      - name: history-refresh
        cron: "*/30 7-23 * * *"
        # 60 min: the 600s default killed every long tick (all 489 failures in this job's
        # history are "timed out after 600000ms", 601-614s durations). Measured 2026-10-13:
        # quiet chain 68-310s import + 60-1124s analyze; loaded chain 1080s import +
        # ~1200s analyze, which still overran a first attempt at 2400000ms.
        timeoutMs: 3600000
        command: spur --no-logo history import && spur --no-logo history analyze

      # 05:00 daily: full-corpus import (checkpoint resume self-heals gaps),
      # then the twelve-section history-anatomy diagnostic report headless. On
      # a cache hit the workflow skips the token-expensive model stages and
      # republishes provenance (ADR-079), so a ready report costs no tokens.
      # Ends with database maintenance (PRAGMA optimize + wal_checkpoint).
      - name: history-daily-report
        cron: "3 5 * * *"
        # 2h: every run since creation (33/33) died on the 600s default, because
        # full-corpus import alone costs ~310s and the workflow adds agent stages.
        timeoutMs: 7200000
        command: >-
          spur --no-logo history import --source all &&
          spur --no-logo workflow run config/workflows/history-anatomy.yaml --quiet &&
          spur --no-logo self maintain

      # 04:30 daily: kk-daily-ai-voice2 end-to-end over the kk store (extract →
      # plan → article/cover/script → nested safety gate → audio → publish
      # surfdash + podcast → soft channels → ledger). It supersedes
      # kk-daily-ai-voice.yaml (design docs/design/kk-collect-and-daily-voice2.md
      # §8 cut-over): the store, not an in-run ingest fan-in, is its source, so
      # this job no longer collects. Morning results (episode audio, show notes,
      # run report) land in .works/kk-daily-ai-voice2/<date>/. Voice-gen runs
      # against hosted Gemini TTS (vdriver=gemini, the workflow default —
      # GEMINI_API_KEY + GEMINI_TTS_MODEL live in ~/.config/kk/config.yaml's
      # gemini-tts env block; a 1-segment smoke render took 23s on 2026-10-10).
      # No local Voicebox server is involved: the gemini client is a
      # clientOverride path, so voice-gen's local-server auto-start never fires.
      # cover_enabled stays at its workflow default (true, minimax/image-01).
      #
      # 04:30 and not 06:00, because the pool must already be in the store:
      # `kk store extract` only sees what the preceding 04:00 kk-collect tick has
      # ingested AND labeled. Measured kk-collect durations (runs table,
      # 2026-10-08..10-10): 8 scheduled ticks avg 9.4 min, max 15.3; the two 04:00
      # ticks were the fast ones at 4.8 and 5.5 min (collect 253s/308s + label
      # 19-33s, store ready by 04:05); across all 14 recorded runs the worst was
      # 16.8 min. A pathological 04:00 tick would therefore still finish by
      # ~04:17, so 04:30 clears the observed worst case by ~13 min while handing
      # the run a fresh pool (extract window 24h against a 6h collect cadence).
      #
      # Cut-over caveat (2026-10-10): `kk ledger cutover-check --candidate
      # kk-daily-ai-voice2 --baseline kk-daily-ai-voice --runs 5` still reports
      # ready=false, streak 1/5 — the newest voice2 runs are dry-run (no classify
      # step), so publish parity against voice1 is unproven. This job is the first
      # scheduled voice2 publishing path; check the first two ticks.
      # Supervised local 04:30 daily run; explicit vars and works root.
      # Internal 3h45m deadline closes owned runs before the outer four-hour kill.
      # codex-sol passed a real artifact-write probe during the 2026-11-01 recovery.
      # Retry stays on a DIFFERENT binary (2026-11-04): spur's readiness gate SIGTERMs
      # `<agent> --version` after a fixed 5s, and when the 04:30 codex probe stalled past it, the
      # codex-sol retry hit the same stalled probe 5s later — plan-translate never dispatched.
      # --window 72h (2026-11-05): the 24h pool produced 3 items / an 8.4-min script and the
      # 15-min floor refused before TTS (duration-refusal on 11-05); the extract ladder's
      # raw-pool estimate over-counts stub bodies, so pin the window to 72h until ingest bodies
      # or label quality widen the fresh pool again.
      - name: kk-daily-ai-voice
        cron: "30 4 * * *"
        timeoutMs: 14400000
        command: >-
          KK_BROWSER_CHANNEL=chrome bun plugins/kk/scripts/daily-scheduled-run.ts
          --repo /Users/robin/xprojects/knowledge-kit
          --works-dir /Users/robin/xprojects/knowledge-kit/.works
          --agent codex-sol --retry-agent claude
          --workflow kk-daily-ai-voice3 --window 72h

      # 07:00 daily: the publish3 `overseas-rss` window (design kk-daily-ai-voice3 §5a) — X/Threads
      # overseas targets behind the podcast RSS gate, the first of the two scheduled windows to ship
      # (after-generate is nested in the 04:30 voice3 run; cn-peak at 09:00 Asia/Shanghai is
      # deliberately NOT here — firing it at 07:00 would make its wait-until node sleep ~10h inside
      # this job; it gets its own ~17:00-local entry when its rows go live). The window launcher is
      # plugins/kk/scripts/voice3-publish-window.ts (cron-safe LA date math: overseas reads YESTERDAY's
      # generation bundle, per R1). Unattended-safe because every overseas row is dummy/off in the
      # pinned daily-ai-voice preset — no live row means the send-confirm pause never fires.
      #
      # Second trigger (operator request 2026-11-05): if today's voice3 receipt is missing or a hard
      # failure (failed/timed-out/interrupted — NOT 'running', the 04:30 job can legally still be
      # executing until ~08:30, and a duplicate run would fight it for the store lock), re-run voice3
      # first with the same flags as the 04:30 job, then publish either way — receipts make the
      # window a no-op for what is already delivered, and a gated miss is diagnosed, not silently
      # dropped. 6h timeout = one 3h45m retrigger budget plus the window.
      - name: kk-daily-publish3
        cron: "0 7 * * *"
        timeoutMs: 21600000
        command: >-
          STAMP=$(TZ=America/Los_Angeles date +%Y%m%d);
          RC=".works/kk-daily-ai-voice2/$STAMP/schedule-receipt.json";
          STATUS=$(jq -r '.status // "missing"' "$RC" 2>/dev/null || echo missing);
          echo "kk-daily-publish3: voice3 receipt status=$STATUS";
          case "$STATUS" in done|no-content|incomplete|running) ;; *)
          KK_BROWSER_CHANNEL=chrome bun plugins/kk/scripts/daily-scheduled-run.ts
          --repo /Users/robin/xprojects/knowledge-kit
          --works-dir /Users/robin/xprojects/knowledge-kit/.works
          --agent codex-sol --retry-agent claude
          --workflow kk-daily-ai-voice3 --window 72h;; esac;
          bun plugins/kk/scripts/voice3-publish-window.ts --window overseas-rss

      # 04:05, 10:05, 16:05, 22:05 daily: kk-collect standalone 6-hourly collection
      # into the kk store (aihot + last30days + horizon -> store ingest -> label).
      # :05 and not :35 (2026-10-18): the 04:30 kk-daily-ai-voice run reads the pool this job
      # writes, so a :35 tick lands five minutes AFTER that run and leaves it a 6.5h-stale store
      # (a separately installed launchd plist, 04:00, is the other feeder and was skipped as
      # "service inactive" today). Measured collect 4.8-15.3 min, so :05 lands by ~04:20 either way;
      # the launchd :00 tick and this one serialize on `kk store lock`, so the second of the pair skips.
      - name: kk-collect
        cron: "5 4,10,16,22 * * *"
        timeoutMs: 14400000
        command: spur --no-logo workflow run plugins/kk/workflows/kk-collect.yaml --quiet

      # 04:00 Sunday weekly: deep database maintenance (VACUUM defragmentation +
      # page compaction, PRAGMA optimize, and WAL checkpoint truncation).
      - name: database-weekly-maintenance
        cron: "0 4 * * 0"
        command: spur --no-logo self maintain --vacuum

rules:
  paths:
    - .spur/rules/**/*.yaml

# workflows:
#   paths:
#     - .spur/workflows/

redaction:
  enabled: false

# ── Release (spur builder bump-ver / drop-tags) ──
# Release plumbing knobs consumed by `spur builder bump-ver` / `drop-tags`
# (wired as the bump-ver / drop-tags package scripts). `bun run bump-ver <version> --push`
# releases the CLI. `aggregatePackage` below names the published package, so the *bare*
# `spur builder bump-ver <version> --push` form also pushes the scoped trigger tag
# @gobing-ai/knowledge-kit-v<version> that .github/workflows/publish.yml consumes.
# Without it (spur < 0.3.83 ignores the key — the pinned scripts still work) a targetless bump
# would touch only the `workspace:`-pinned private packages and tag the aggregate
# `knowledge-kit-v<version>` (the root package name), which no workflow consumes.
# Values match the built-in defaults; adjust here instead of patching release code when
# conventions change.
builder:
  # The bun preset resolves `check-feature` to `bun run spur-check-feature`, which now exists as an
  # alias of the repo-wide gate (spur's feature-lifecycle FSM runs it when a feature enters
  # `verifying`, ADR-142). The pin stays explicit so a future preset change cannot silently repoint
  # feature completion at a narrower command.
  actions:
    check-feature: bun run spur-check
  bump-ver:
    # Needs spur >= 0.3.83 (released 2026-09-16); older spur silently ignores the key.
    aggregatePackage: knowledge-kit
    tagVersionSeparator: "-v"
    publishWorkflow: publish.yml
    releaseCommitType: chore
    releaseCommitScope: release
    ghRunListLimit: 5
    # Version carriers beyond the built-ins (workspace package.json; marketplace + entry
    # plugin.json). None needed here — the built-ins already cover superskill-facing
    # staleness detection. Registry: apps/cli/src/version-carriers.ts (in spur-new).
    versionCarriers: []

# ── Planning (design §2.1 / §9) ──
tasks:
  active: docs/tasks
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary

features:
  dir: docs/features

# Machine-wide default: bundled workflows shipped in the installed package.
# TODO: switch to `- bundled:workflows` once the installed spur carries
# BUNDLED_PATH_PREFIX expansion (monorepo config/config.global.yaml + workflow.ts);
# 0.3.61 predates it and would list nothing.
# Repository workflows are discovered through .spur/workflows -> ../plugins/kk/workflows.
workflows:
  paths:
    - /Users/robin/node_modules/@gobing-ai/spur/config/workflows/

# ── Decisions (ADR-134) ──
# The kk item-label catalog, served to `kk store label` through `spur decision run`
# (design kk-collect-and-daily-voice2.md §4). Project-relative, so the paths resolve
# from the repo root on any checkout.
#
# The installed package's own catalogs (task-pipeline's task-triage / failure-class /
# review-failure-class, gates, idea-pipeline, ...) load automatically as the SHARED layer
# (`spur decision status` → layers.shared). Do not list that folder here: an entry in this list
# is a REGISTERED layer, which outranks shared, so an absolute path into the installed package
# re-registers the same files and lets a stale copy shadow newer bundled catalogs. (Removed
# 2026-10-19; it was a workaround from spur 0.4.2, before the shared layer existed.)
decisions:
  paths:
    - plugins/kk/decisions
  maker: fm-local
  makers:
    # 2026-10-21: fm-local is primary again — the operator accepted the Apple Foundation Models CLI
    # licence (09:46 local; `fm license --status` → "Agreed to license FM1 version 1.0"). The
    # typesafe detour earlier that day existed only because every unlicensed ask answered
    # `no-backend` and `kk-item-category` then fell back to `non-ai` for EVERY item, which emptied
    # the ai-news pool. Keep the four decisions named explicitly so an unlicensed machine fails
    # visibly here instead of silently starving the pool.
    kk-item-category: fm-local
    kk-item-importance: fm-local
    kk-item-urgency: fm-local
    kk-item-impact: fm-local
    # Restored to laya-local 2026-10-19 (task 0317 R5): spur 0.4.17 ships `worker/laya_worker.py`
    # (spur-new 1262), and `spur decision run kk-item-quality` answers `maker: laya-local,
    # reason: accepted` in ~1s. Before 0.4.17 every ask failed with `reason: error` in ~20ms.
    kk-item-quality: laya-local
    kk-item-china-politics: typesafe
    kk-item-sensitivity: typesafe
    kk-item-audience: typesafe
    # kk-item-sensitivity routes to typesafe; score positions are rounded to nearest level (task 0240).
