# Spur project configuration for knowledge-kit
# Generated by `spur init`; upgraded to schema 1.2 (bundled workflows; stock workflow YAMLs resolve from the package, not .spur/workflows).

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1.2"
name: knowledge-kit

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
bootstrap:
  logging:
    enabled: true
    level: info
    console: false
    json: true
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: false

# ── Spur app section (validated by spurConfigSchema in @gobing-ai/spur-config) ──
agent:
  default: omp

  # ── Executors (ADR-033 adaptive model routing) ──
  # `tier` is DECLARED, never inferred. Without it, agent-service falls back to a
  # regex over `name + model + agent` which misclassifies silently.
  # Selection: a stage takes the CHEAPEST executor whose tier >= its `min_tier`
  # (cheap=1 < standard=2 < capable-1=3 < capable-2=4 < capable-3=5); array order
  # is the last-resort tie-break within the exact same tier value.
  executors:
    # cheap — mechanical, high-volume work
    - name: minimax
      agent: omp
      model: minimax/MiniMax-M3
      tier: cheap

    # standard — implementation, tests, wrap-up (omp first: the working default)
    - name: omp
      agent: omp
      tier: standard
    - name: omp-zai
      agent: omp
      model: zai/glm-5.2
      tier: standard
    - name: omp-zai-nvidia
      agent: omp
      model: nvidia/z-ai/glm-5.2
      tier: standard
    - name: omp-zai-volc
      agent: omp
      model: volc/glm-5.2
      tier: standard
    - name: omp-zai-ollama
      agent: omp
      model: ollama/glm-5.2:cloud
      tier: standard

    # capable-1/2/3 — planning, verification, dogfooding
    # 1 = low output quality within the capable band, 3 = high.
    - name: pi-k3
      agent: pi
      model: "k3[1m]"
      tier: capable-1
    - name: omp-k3-ollama
      agent: omp
      model: ollama/kimi-k3:cloud
      tier: capable-1
    - name: omp-deepseek
      agent: omp
      model: deepseek/deepseek-v4-pro
      tier: capable-2
    - name: grok
      agent: grok
      tier: capable-2
    - name: codex
      agent: codex
      tier: capable-3

rules:
  paths:
    - .spur/rules/**/*.yaml

# workflows:
#   paths:
#     - .spur/workflows/

redaction:
  enabled: false

# ── Planning (design §2.1 / §9) ──
tasks:
  active: docs/tasks
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary

features:
  dir: docs/features
