name: xhs-card
description: >-
  Xiaohongshu (XHS) knowledge card — 3:4 portrait card. Chinese headline and
  bullets are typeset from Noto Sans SC via headless Chromium; the provider
  prompt is the illustration only and must not ask for writing. Adapted from
  baoyu-xhs-images (MIT © Jim Liu); see
  plugins/kk/skills/xhs-images/references/card-layouts.md.
job: free
aspectRatio: '3:4'
width: 1080
height: 1440
defaultStyle: xhs-knowledge
keywords:
    - text-free flat illustration
    - blank unlabeled surfaces
    - empty screens and empty signs
    - fresh clean design
    - flat geometric accents
    - professional color grading
outputFilename: 'card-{{index | 01}}.png'
compose:
    engine: text-card
    safeArea: 72
    headlineMinPx: 64
    bodyMinPx: 36
    illustrationHeight: 880
    palette:
        background: '#FFFFFF'
        text: '#1F2328'
        accent: '#FF2442'
    fonts:
        headline: NotoSansSC-Bold.otf
        body: NotoSansSC-Regular.otf
variables:
    role:
        description: Card role in the series (cover, content, closing)
        default: content
    layout:
        description: Layout name from xhs-images references (see references/card-layouts.md)
        default: definition
    headline:
        description: Short on-card headline (Chinese, ≤ 12 chars recommended)
        default: 核心概念
    points:
        description: 2–4 short on-card bullet points, one per line
        default: ''
    subject:
        description: Visual scene or metaphor illustrated on the card
        default: clean flat illustration of the core concept
    index:
        description: Card number in the series (zero-padded)
        default: '01'
    content:
        description: Additional context (use --content)
        default: ''
template: |-
    Portrait illustration, 3:4, one scene for a card series.
    Card role: {{role | content}}. Layout: {{layout | definition}}.
    Visual scene: {{subject | clean flat illustration of the core concept}},
    rendered as a flat illustration with subtle geometric decorations.
    Illustration only. Every surface stays blank: empty screens, empty signs,
    empty labels. No writing, no letters, no numerals, no captions, no logos,
    no watermark, no UI chrome. Words are typeset later, outside this image.
    Fresh clean design, comfortable margins, crisp details, professional color
    grading. {{content}}
