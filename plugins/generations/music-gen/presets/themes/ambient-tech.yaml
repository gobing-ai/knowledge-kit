name: ambient-tech
description: Glassy ambient techno with a steady pulse.
intended_use: Product walkthroughs, conference holds, editorial beds that must stay out of the way.
genre: glassy ambient techno
tempo: 100-115 BPM, steady and unaccented
key: C# minor
instrumentation:
  - glassy FM bell
  - granular pad
  - muted kick and rim clicks
  - clean sub pulse
  - long reverb tail
vocal_character: no lead vocal; occasional whispered, heavily reverberated fragments
production: long reverb tails, wide stereo field, clean digital low end
