[project]
name = "omni-voice-gen"
version = "1.0.0"
description = "OmniVoice-backed voice generator plugin for knowledge-kit"
requires-python = ">=3.10"
dependencies = [
    "omnivoice",
    "pyyaml",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_voice_gen"]
