# kk item-label decision catalog (task 0209, design §4).
#
# One decision per item label `kk store label` writes: the MECE category plus the
# four 0–5 QC dimensions. The rubric texts and the choice vocabulary mirror
# episode-plan-gen's keyword heuristic (`classifyCategory` / `scoreDimensions`), so a
# model answer and a heuristic answer are directly comparable rows in `labels`.
#
# Resolution: registered through `decisions.paths` in `.spur/config.yaml`
# (project-relative `plugins/kk/decisions`). No kk workflow reads this catalog as a
# `decide` action; `kk store label` calls `spur decision run` and degrades to the
# heuristic when the backend does not answer.
$schema: "@gobing-ai/spur/schemas/decision-catalog.schema.json"
version: 1

defaults:
    # 0 since task 0226: every model answer is accepted raw, so a low-confidence answer is
    # recorded (raw_value/raw_confidence) instead of being resolved to the declared fallback.
    # The confidence threshold lives in the kk config (`store.labels.min_confidence`), where it
    # gates only which stored observation is current for extraction — never this pass.
    minConfidence: 0

decisions:
    kk-item-category:
        type: choice
        description: Which MECE category does this collected item belong to?
        parameters:
            title:
                type: string
                description: Item title (the heuristic's first keyword surface).
            source:
                type: string
                description: Ingest plugin that produced the item (e.g. aihot, rss, polymarket).
        criteria:
            ai-news: Launch, release, announcement or product news about AI — the company/lab keyword surface.
            ai-technical: Engineering substance — APIs, SDKs, tutorials, benchmarks, architectures, inference.
            ai-research: Research output — papers, alignment, evaluations, novel findings.
            ai-industry: Company and market signals — funding, acquisitions, valuation, policy, regulation, litigation.
            non-ai: No AI signal survives the keyword scan, or a deny rule (non-AI source, junk phrase, non-AI tag) wins.
        fallback: non-ai

    kk-item-quality:
        type: score
        description: How substantive is the item's body (length and sourcedness)?
        parameters:
            title:
                type: string
                description: Item title.
            source:
                type: string
                description: Ingest plugin that produced the item.
        criteria:
            - Empty or unusable body — nothing to read.
            - Headline echo — a stub body under 300 characters, source mention only.
            - Around 1.5k characters — a short but substantive report.
            - Around 3k characters — a fully developed report.
            - Around 4.5k characters — a detailed report with context.
            - Around 6k characters or more, or any substantive body carrying a verifiable source URL.
        fallback: 2

    kk-item-importance:
        type: score
        description: How much does the item matter to an AI audience (source tier plus relevance)?
        parameters:
            title:
                type: string
                description: Item title.
            source:
                type: string
                description: Ingest plugin that produced the item.
        criteria:
            - No audience signal at all.
            - Tail source or unknown origin — incidental aggregation.
            - Tail source (reddit, youtube, github, polymarket) — worth a slot on a thin day.
            - Ranked feed (rss, horizon) — a horizon-ranked story.
            - Human-curated front page (aihot) — the editor's own pick.
            - Any tier whose relevance score is 0.8 or higher — a signal-confirmed story.
        fallback: 2

    kk-item-urgency:
        type: score
        description: How time-sensitive is the item relative to the plan date?
        parameters:
            title:
                type: string
                description: Item title.
            source:
                type: string
                description: Ingest plugin that produced the item.
        criteria:
            - No publication date and no curated-recency signal — urgency cannot be judged (the heuristic never files this level).
            - Published more than 7 days before the plan date — stale, archive material.
            - Published 3 to 7 days before the plan date — cooling (the heuristic never files this level).
            - Published within the last 7 days, or an undated same-day curated source — the default.
            - Published 1 to 2 days before the plan date — still breaking.
            - Published on or after the plan date — same-day news.
        fallback: 2

    kk-item-impact:
        type: score
        description: How large is the item's measured engagement?
        parameters:
            title:
                type: string
                description: Item title.
            source:
                type: string
                description: Ingest plugin that produced the item.
        criteria:
            - No engagement recorded at all — unmeasurable reach (the heuristic never files this level).
            - Engagement magnitude 1 or less — a single mention.
            - Engagement magnitude above 1 — the item is being shared.
            - Engagement magnitude above 10 — a discussion thread.
            - Engagement magnitude above 100 — a widely shared story.
            - Engagement magnitude above 1000 — a breakout story.
        fallback: 2

    # Task 0229 R1: moderation-risk judgment, consulted for every labelled item (the plugin's
    # keyword heuristic has no signal for it). Four levels, 0-3. The description carries the
    # scope rule verbatim: this decision exists to avoid platform-moderation rejection and must
    # NOT exclude China-related content.
    kk-item-china-politics:
        type: score
        description: >-
            Moderation risk from China's current political system or institutions, or from the top
            leader's personal information. Purpose: avoid unnecessary platform-moderation
            rejection. It must NOT exclude China-related content in general: Chinese companies,
            models and products, the Chinese AI industry and ordinary regulation news stay eligible.
        parameters:
            title:
                type: string
                description: Item title (the keyword-prefilter surface).
            source:
                type: string
                description: Ingest plugin that produced the item.
        criteria:
            - No reference to China's political system, institutions or top leader. Chinese companies, models and products count as 0.
            - A factual mention of a Chinese government body or policy as news context (a CAC filing, an export rule).
            - Commentary or analysis of the political system or institutions.
            - The top leader's personal information, or a direct critique of the system.
        fallback: 3

    # Task 0229 R2: broader publish risk (unverified claims, legal exposure, other political
    # sensitivity), consulted for every labelled item.
    kk-item-sensitivity:
        type: score
        description: >-
            Broader publish risk: unverified claims, legal exposure, and other political
            sensitivity that could draw a takedown, correction or complaint after publishing.
        parameters:
            title:
                type: string
                description: Item title.
            source:
                type: string
                description: Ingest plugin that produced the item.
        criteria:
            - No publish risk — verifiable claims, no legal exposure, no political sensitivity.
            - Mild risk — an unverified or single-source claim the episode can attribute.
            - Notable risk — a contested factual claim, a named individual's allegation, or legal exposure to hedge.
            - High risk — a defamatory or legally actionable claim, or acute political sensitivity.
        fallback: 1

    # Task 0229 R2: reader depth, which routes an item to a future topic. Consulted for every
    # labelled item.
    kk-item-audience:
        type: choice
        description: Which reader depth does this item best serve (which future topic it routes to)?
        parameters:
            title:
                type: string
                description: Item title.
            source:
                type: string
                description: Ingest plugin that produced the item.
        criteria:
            general: Accessible with no AI background — product, company or market news.
            practitioner: Assumes working AI engineering knowledge — APIs, tooling, deployment, benchmarks.
            researcher: Assumes research fluency — papers, methods, evaluations, alignment findings.
        fallback: general
