# ai-news topic profile (task 0210 R1, design kk-collect-and-daily-voice2.md §4).
#
# The episode pool for the daily AI-news workflow: every labelled item in the
# launch/industry categories with a substantive body and real audience signal,
# most time-sensitive first. `kk store extract --topic ai-news` compiles this into
# one parameterized query over `items` + `labels` — a new topic is a new file here,
# never a code change.
#
# Keys are decision ids from the sibling catalog (plugins/kk/decisions/kk-items.yaml);
# an unknown key or decision id fails loud with `kk.store.profile.invalid`.
# `limit` 32 (2026-11-15, task 0377): the omitted default of 20 capped a week-wide pool at 20
# items, which after QC admitted ~11.4k chars = 10.3 min against the 15 min floor, so a thin week
# could never clear it however far the ladder widened. 32 items keeps the estimate inside the
# 15-25 min window (measured: 45,163 raw chars -> ~16.4 min) instead of refusing the day.
limit: 32
topic: ai-news
where:
  # 2026-10-21: the allowlist is the whole AI taxonomy, in lockstep with the workflow's
  # qc_categories (`ai-news,ai-technical,ai-research,ai-industry`) and episode-plan-gen's
  # DEFAULT_FILTER_CONFIG. The two-category gate here front-ran that widening one layer upstream:
  # a live pool labelled 20 ai-industry + 7 ai-research + 7 ai-technical + 3 ai-news came out of
  # extract as 6 items, so `daily-qc-content`'s floor refusal closed the day as no-content before
  # the widened QC allowlist could admit a technical or research story.
  kk-item-category: { in: [ai-news, ai-industry, ai-technical, ai-research] }
  # quality 2, not 3: real ingest bodies (last30days/aihot summaries) are stub-length, so the
  # heuristic labeler tops out at 1-2 and a gte-3 gate empties every real pool (task 0212 dogfood
  # finding). Raise this back when a full-text ingest source lands.
  kk-item-quality: { gte: 2 }
  # importance 2, not 3 (2026-10-18): this profile selects the *pool*; the 3-cutoff belongs to
  # `daily-qc-content`, which backfills importance-only rejects (`backfillToFloor`, 20261002) so a
  # thin news day deepens instead of shipping a stub. A gte-3 gate here front-ran that backfill and
  # made it dead code on the store path: on 2026-10-18 the run closed `done-no-content` with a
  # 2-item / 9.1-min pool while six quality-2, importance-2 AI items sat in the same 24h window.
  # The key still has to be present — an unjudged item stays excluded (fail-closed INNER join).
  kk-item-importance: { gte: 2 }
  # Conservative moderation gate (task 0229 R5): 0-1 is "no reference to the political system" or
  # "a factual policy/government mention as news context". A `where` key is an INNER join on
  # `labels_current`, so an item with NO current china-politics answer is excluded (fail-closed) —
  # the pool shrinks rather than admitting an unjudged item. Chinese companies/models/industry do
  # not trip the gate: they score 0.
  kk-item-china-politics: { lte: 1 }
order: [kk-item-urgency desc, kk-item-impact desc, first_seen_at desc]
