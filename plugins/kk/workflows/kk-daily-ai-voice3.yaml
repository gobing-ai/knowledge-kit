---
name: kk-daily-ai-voice3
kind: dag
description: >-
  The generate half of voice3 (design docs/design/kk-daily-ai-voice3.md §4, task 0324): topic →
  QC/translate → drafts → content safety → operator review → audio ∥ images → quality, then the
  generate-side channel payloads (`social-write` + `daily-bundle-variants`) and the frozen
  `bundle.json` that `kk-daily-publish3` consumes. It publishes nothing: every channel decision and
  every send lives in the publish preset and the publish workflow, which is why this graph carries
  no `xhs_*` / `wechat_*` / `publish_enabled` switch. Production since the 2026-11-05 cutover (§8);
  it still runs in voice2's namespace (work dir, store selections, prepare ledger) by design (§11).

vars:

  # ---- voice3 additions (task 0324 R4) ----
  # `auto_publish` launches publish3 nested when true; off by default exactly like voice2's
  # publish_enabled, and the operator turns it on in the schedule entry after the shadow period.
  # Card-series authoring/rendering (billed image generation). Turned on by default for XHS 上传图文.
  cards_enabled: "true"
  # Card count (voice2's `xhs_cards`, minus the channel name): the card plan targets this many.
  cards: "6"
  auto_publish: "false"
  publish_window: "after-generate"
  publish_preset: ""
  publish_dummy: "false"
  # 0334 R7: opt-in live consent channel, forwarded verbatim to the nested publish3
  # `live_channels`. Empty by default — this variable alone can never produce a live send
  # (ADR-022: only an operator launch that sets it, with tokens the plan stage validates
  # against the window, promotes rows; `publish_dummy=true` and a non-empty token list
  # refuse each other at plan time).
  publish_live_channels: ""
  # Composed by the `prepare` node (`kk daily prepare`), then read back into vars through the
  # single-node read chain below — shell actions cannot set vars, and a concurrent `setVars` merge
  # is last-writer-wins, so the DAG exchanges data by fixed paths under work_dir, never by vars.
  work_dir: ""
  # Digits-only run-date stamp the artifact names carry; projected from <work_dir>/run-date.txt.
  run_date: ""
  # Store extract window (kk store extract --window). The old workflow's ingestion window was
  # intrinsic to the fan-in; here it is the pool's freshness bound (kk-collect refreshes every 6h).
  window: "24h"
  language: "zh"
  voice_profile: "robin-news"
  # Voice driver switch — voxcpm (voxcpm-tts) | gemini (gemini-tts) | voicebox (voice-gen)
  # | ominivoice (omni-voice-gen). The generate tier below mirrors the fallback order, and the
  # fit/duration gates take their spoken-char rate from this var — switching drivers here is enough.
  # 2026-10-20 (operator decision): voxcpm STAYS the primary. It is audibly echoey - a 40 ms periodic
  # reflection on renders longer than ~30 s plus a pause floor only 16-22 dB below speech, measured by
  # `kk stage audio-quality` on every episode's raw model output since 10-15 (cepstrum 40 ms @ 26-31 dB
  # / pauseFloor -16..-22 dB, versus gemini's 20-25 ms @ 19-20 dB / -34..-37 dB) - and no exposed knob
  # (cfg_value, inference_timesteps, normalize, denoise) or usable checkpoint fixes it (VoxCPM1.5:
  # 80 ms @ 31 dB; VoxCPM-0.5B loses the lattice but measures -15.5 dB at 16 kHz). The operator keeps
  # the local driver for its speed and cost and will monitor it episode by episode until a proper fix
  # exists; flipping this one var to "gemini" is the escape hatch (measured dry: 20-25 ms / -34..-37 dB)
  # at the price of a 1h47m-2h21m remote render.
  vdriver: "voxcpm"
  intro_music: "~/.config/kk/voices/AI每日资讯_8秒播客片头.mp3"
  surfdash_root: "/Users/robin/xprojects/surfdash"
  title: ""
  skip_review: "false"
  transcode_mp3: "true"
  podcast_artist: "Robin Min"
  podcast_album: "咸话咸说"
  cover_enabled: "true"
  cover_provider: "minimax"
  cover_model: "image-01"
  cover_fallback: ""
  # 0219 R3: image-gen vendor fallback for the XHS render; "" restores strict fail-fast.
  xhs_fallback: "true"
  xhs_style: "xhs-knowledge"
  xhs_provider: "minimax"
  xhs_model: "image-01"
  # The 合集 tag a channel payload carries is that channel's preset `options` (the shipped preset
  # pins 「每日AI资讯」), not a generate-side var: voice3 does not know which channels exist.
  plan_max_items: "20"
  curate_enabled: "true"
  script_write_enabled: "true"
  plugins_path: ""
  # Content-safety budget and platforms, forwarded to the nested kk-daily-safety state machine.
  safety_max_revise: "2"
  safety_platforms: "xiaoyuzhou,apple-podcasts,wechatmp"
  agent: "inline"
  # 0238 R2: executor for the `-retry` siblings of the two hard-fail agent.run producers. The
  # siblings declare `role: reviewer` (capable-1), two rungs above the primary's `scribe`, so the
  # default `inline` resolves the retry above any rung the primary reaches by climbing past an
  # unusable cheap executor (ac5-live-1). The operator may still pin a known-good executor here.
  agent_retry: "inline"
  # QC pins — lockstep with episode-plan-gen's DEFAULT_FILTER_CONFIG (env wins), same as voice1.
  qc_categories: "ai-news,ai-technical,ai-research,ai-industry"
  qc_min_quality: "2"
  qc_min_importance: "2"
  qc_min_urgency: "1"
  qc_min_impact: "0"
  qc_min_episode_items: "8"
  episode_min_minutes: "15"
  # 2026-10-09 operator decision: ingest bodies are spoken in full and today's pools render 22-46
  # minutes at the current item counts, so the 20-minute ceiling refused real episodes before any
  # TTS request. The pair drives the pre-spend estimates (`daily-qc-content`'s pool gate, and
  # `daily-generate`'s script gate, which measures the authored VoiceScript) and the measured gate
  # in `daily-episode-duration`.
  episode_max_minutes: "25"
  # Run id, injected by spur at launch (0674 R5/R8) — the selections / ledger / mark-published
  # identity. A shell command may only reference declared vars.
  __runId: ""
  # Executed definition digest, injected by spur at launch (G8 §9). The Board capture compares it
  # with the named definition and records the topology only on exact agreement.
  __definitionDigest: ""

# One action per node (engine: DagNodeDef.action), no back-edges (ADR-031). A node whose deps are
# ALL skipped is skipped; a done+skipped mix proceeds — which is how the empty-pool path still
# reaches run-report and ledger (they list `extract` in dependsOn, G11 R3).
#
# NODES ARE DECLARED IN TOPOLOGICAL ORDER (every node after all of its `dependsOn`). The engine
# settles skips in one sweeping pass over this list, in declaration order, and stops as soon as a
# pass finds no ready node — a node declared before a dependency that becomes `skipped` later in
# that same pass stays `pending` and the run ends `dag-unreachable-nodes` instead of `done`.
#
# Fail-fast is the other half: any failed node fails the run, so every non-blocking channel (xhs,
# wechat, locales) keeps its exit-0-on-soft-failure kk stage. `onError: continue` sits where voice1 had
# it (cover-brief, script-write) and, since 0238 R2, on the two hard-fail agent.run producers
# (plan-translate, article-write), whose `-retry` siblings below carry the loud second attempt.
# Wave-level waiting is the accepted ceiling (design §6): a node starts when its own deps settle,
# but its whole wave is awaited before the next wave is dispatched.
nodes:
  - id: prepare
    description: >-
      Sync the workflow ledger and compose today's workspace: `kk daily prepare` writes the effective
      work_dir to .spur/runs/kk-daily-ai-voice2/work-dir.txt, the run date to <work_dir>/run-date.txt,
      the artifact directories and the safety revise budget. `kk ledger sync` records runs that
      already finished without a ledger row (failed ones included) — a fail-fast DAG never reaches
      its own `ledger` node, so the next run's prepare is the backfill (design §7).
      The `daily-preflight` stage runs FIRST: the scheduler executes this checkout's YAML while
      `kk stage` resolves its stage runner from the installed package, so a run whose YAML names a
      stage the installed runner lacks must fail here, naming the stage, instead of 29 minutes later
      inside the nested safety machine (2026-10-20: `unknown stage: daily-safety-verdict`, nothing
      published).
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-preflight plugins/kk/workflows/kk-daily-ai-voice3.yaml
          plugins/kk/workflows/kk-daily-safety.yaml
          plugins/kk/workflows/kk-daily-publish3.yaml
          && kk daily prepare --workflow kk-daily-ai-voice2 --run-date "${vars.run_date}" --ledger-sync
          --run "${vars.__runId}" --definition-digest "${vars.__definitionDigest}"
          --setting window="${vars.window}" --setting language="${vars.language}" --setting vdriver="${vars.vdriver}"
          --setting skip_review="${vars.skip_review}" --setting transcode_mp3="${vars.transcode_mp3}"
          --setting cover_enabled="${vars.cover_enabled}" --setting curate_enabled="${vars.curate_enabled}"
          --setting script_write_enabled="${vars.script_write_enabled}" --setting plan_max_items="${vars.plan_max_items}"
          --setting safety_max_revise="${vars.safety_max_revise}" --setting qc_min_quality="${vars.qc_min_quality}"
          --setting qc_min_importance="${vars.qc_min_importance}" --setting qc_min_urgency="${vars.qc_min_urgency}"
          --setting qc_min_impact="${vars.qc_min_impact}" --setting qc_min_episode_items="${vars.qc_min_episode_items}"
          --setting episode_min_minutes="${vars.episode_min_minutes}" --setting episode_max_minutes="${vars.episode_max_minutes}"

  - id: read-work-dir
    description: "Project the effective work_dir into vars (single-node wave: nothing has fanned out yet)"
    dependsOn: [prepare]
    action:
      kind: file.read.into-var
      options:
        path: .spur/runs/kk-daily-ai-voice2/work-dir.txt
        var: work_dir

  - id: read-run-date
    description: "Project the digits-only run-date stamp into vars (single-node wave, after work_dir is known)"
    dependsOn: [read-work-dir]
    action:
      kind: file.read.into-var
      options:
        path: ${vars.work_dir}/run-date.txt
        var: run_date

  # 20261012: a dead browser session must be named BEFORE the run's ~40 minutes of generation, not
  # after. On 2026-10-12 the saved MP session was refused server-side (unexpired cookies, but the
  # console served its QR login and /cgi-bin/home carried no token), so `wechat-publish` failed soft
  # at the very end and the operator only learned it by noticing the missing draft. A leaf off the
  # head chain on purpose: `extract` keeps `read-run-date` as its only dependency, so the head chain
  # stays single-node waves, and nothing depends on this node — it warns, it never routes.

  - id: session-preflight
    description: >-
      Probe each enabled publish channel's saved browser session up front and WARN when one is
      dead, naming the operator action. The probe set is derived from the publish PRESET (0325), not
      from workflow vars: this workflow no longer knows which channels exist. Warning-only by
      construction (onError: continue) — the channel's own publish receipt stays the authority.
    dependsOn: [read-run-date]
    action:
      kind: shell
      options:
        command: >-
          kk stage run publish-matrix-check "${vars.work_dir}" --all-windows
          || echo "session-preflight: a publish channel's saved session was refused — fix it with: kk bot login <channel>"
      onError: continue

  - id: extract
    description: >-
      Select today's episode pool from the kk store: the ai-news topic profile over the labels
      kk-collect wrote, minus every story already selected or published for the ai-news topic (the
      store's `selections` ledger, written by the `select` node below). Writes
      <work_dir>/10-collect/pool.json (the fan-in blended.json shape) and prints {count}. An empty
      pool writes [] and exits 0 — the run's no-content path, not a failure. The `daily-extract`
      stage widens the window (×2, ×3, capped at 72h) only when the configured window's pool cannot
      reach `episode_min_minutes` (2026-10-19): a published episode consumes more stories than a day
      of collection supplies, so the tight window alone closed 2026-10-18/19 as no-content while
      older unselected items sat in the store.
    dependsOn: [read-run-date]
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-extract "${vars.work_dir}" ai-news "${vars.window}" "${vars.episode_min_minutes}" "${vars.vdriver}"

  - id: plan
    description: >-
      Score/dedup/select + annotate the pool into the episode plan (episode-plan-gen; annotate rides
      inside planEpisode). The labels extract inlined into metadata replace its keyword re-scoring.
      Guarded on the pool: an empty pool skips the whole content subtree, and run-report/ledger
      still run.
    dependsOn: [extract]
    condition:
      kind: shell
      options:
        command: 'kk store pool-count "${vars.work_dir}/10-collect/pool.json" --min 1'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-plan "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}" "${vars.plan_max_items}" "${vars.curate_enabled}"

  - id: qc-content
    description: >-
      Content QC: filter the plan's annotated candidates by category allowlist + score thresholds
      (episode-plan-gen --mode filter). Writes 21-plan/<date>_04_quality-control-content_candidates.json,
      whose length guards the whole content fan-out below — a pool that filtered to zero items ends
      the run as no-content instead of building an empty episode. The stage also applies the
      pre-spend floor gate (2026-10-12): a kept pool whose estimated spoken length cannot reach
      `episode_min_minutes` is emptied here, so a thin day closes as no-content instead of paying
      for a synthesis pass that `daily-episode-duration` then refuses.
    dependsOn: [plan]
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-qc-content "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}" "${vars.qc_categories}" "${vars.qc_min_quality}" "${vars.qc_min_importance}" "${vars.qc_min_urgency}" "${vars.qc_min_impact}" "${vars.qc_min_episode_items}" "${vars.episode_min_minutes}" "${vars.vdriver}"

  # One guard for the whole pool (0324 R3; 0329 F01/F15): it sits right after `qc-content`, in
  # front of every token reader, and NEVER exits non-zero — in this engine a failed dependency
  # never releases its dependents, so a failing gate on an empty pool wedges the graph into
  # dag-unreachable and turns a thin day into a failed run. The token carries the verdict
  # instead: PASS opens the content fan-out, EMPTY makes every token-gated node skip, and the
  # run still closes `done` with a no-content run report.
  - id: pool-gate
    description: >-
      The single pool guard (0324 R3, 0329): `kk store pool-count --min 1` over the candidates
      file that `qc-content` wrote, recorded once as a token at
      `.spur/run/<runId>-pool-gate.status`. A token, not a bare dependency, because the engine
      skips a node only when ALL its dependencies were skipped — so a failed gate beside a done
      dependency would still admit the node. The gate itself always exits 0 (0329: an empty pool
      is a no-content day, not a failed run).
    dependsOn: [qc-content]
    action:
      kind: shell
      options:
        command: >-
          OUT=".spur/run/${vars.__runId}-pool-gate.status";
          mkdir -p "$(dirname "$OUT")";
          if kk store pool-count "${vars.work_dir}/21-plan/${vars.run_date}_04_quality-control-content_candidates.json" --min 1;
          then echo PASS > "$OUT";
          else echo EMPTY > "$OUT"; rm -f "${vars.work_dir}/bundle.json"; fi

  - id: select
    description: >-
      Record today's planned set in the store's topic-scoped `selections` ledger (0228). It runs at
      QC, the moment the run has committed to its episode set, so the cross-day exclusion no longer
      depends on the DAG reaching its tail: a run that fails, pauses at review or skips publish still
      excludes what it planned. Guarded on the QC candidates — a pool that filtered to zero items
      selects nothing.
    dependsOn: [qc-content, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk store select --topic ai-news --workflow kk-daily-ai-voice2 --run "${vars.__runId}"
          --in "${vars.work_dir}/21-plan/${vars.run_date}_04_quality-control-content_candidates.json"

  # ---- editorial pipeline: curate -> script-write (master) -> script -> editorial-render (0345) ----

  - id: script-style
    description: "Snapshot the shipped kk:news-editorial skill and zh style contract into the work dir (20-editorial/news-editorial/ + 24-script/<date>_08_script-write_style.md)"
    dependsOn: [qc-content, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-script-style "${vars.work_dir}" "${vars.run_date}"

  - id: curate
    description: "0345 R7: curate QC candidates into kept translated plan.json + _03_curate_excluded.json via kk:news-editorial mode `curate`; onError: continue — curate-check/curate-fix/curate-final below validate and recover"
    dependsOn: [qc-content, script-style, pool-gate]
    condition:
      kind: shell
      options:
        command: >-
          test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS
          && test "${vars.curate_enabled}" = "true"
          && ! (test -s "${vars.work_dir}/21-plan/${vars.run_date}_03_plan_plan.json" && test -s "${vars.work_dir}/21-plan/${vars.run_date}_03_curate_excluded.json")
    action:
      kind: agent.run
      onError: continue
      options:
        role: scribe
        agent: ${vars.agent}
        timeoutMs: 600000
        # ADR-115 error tier: keep this prompt <= 1000 chars.
        input: |
          Follow mode `curate` in ${vars.work_dir}/20-editorial/news-editorial/SKILL.md (read references/selection.md and references/style-contract.zh.md first).
          --in ${vars.work_dir}/21-plan/${vars.run_date}_04_quality-control-content_candidates.json (metadata.docs is the candidate Doc[]; don't edit it)
          --out-plan ${vars.work_dir}/21-plan/${vars.run_date}_03_plan_plan.json
          --out-excluded ${vars.work_dir}/21-plan/${vars.run_date}_03_curate_excluded.json
          Deliver both JSON files with your file-write tool (headless agy sandbox blocks shell writes).
        expectFile: ${vars.work_dir}/21-plan/${vars.run_date}_03_plan_plan.json
        allowAppend: false

  - id: curate-check
    description: "0345 R8: validate the curate split, unwrap any Content envelope, and dedup near-duplicate titles; writes _03_curate_errors.json on failure"
    dependsOn: [qc-content, script-style, curate, pool-gate]
    condition:
      kind: shell
      options:
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      onError: continue
      options:
        command: >-
          kk stage daily-curate-check "${vars.work_dir}" "${vars.run_date}"

  - id: curate-fix
    description: "0345 R8: one targeted kk:news-editorial `curate --fix` pass on curate-check errors"
    dependsOn: [curate-check, pool-gate]
    condition:
      kind: shell
      options:
        command: >-
          test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS
          && test -s "${vars.work_dir}/21-plan/${vars.run_date}_03_curate_errors.json"
    action:
      kind: agent.run
      onError: continue
      options:
        role: reviewer
        agent: ${vars.agent_retry}
        timeoutMs: 600000
        # ADR-115 error tier: keep this prompt <= 1000 chars.
        input: |
          Follow mode `curate --fix` in ${vars.work_dir}/20-editorial/news-editorial/SKILL.md (read references/selection.md and references/style-contract.zh.md first).
          --in ${vars.work_dir}/21-plan/${vars.run_date}_04_quality-control-content_candidates.json (metadata.docs is the candidate Doc[]; don't edit it)
          --fix ${vars.work_dir}/21-plan/${vars.run_date}_03_curate_errors.json
          --out-plan ${vars.work_dir}/21-plan/${vars.run_date}_03_plan_plan.json
          --out-excluded ${vars.work_dir}/21-plan/${vars.run_date}_03_curate_excluded.json
          Deliver both corrected JSON files with your file-write tool.
        expectFile: ${vars.work_dir}/21-plan/${vars.run_date}_03_plan_plan.json
        allowAppend: false

  - id: curate-final
    description: "0345 R8: final curate validation; falls back to untranslated candidates with [] exclusions if still invalid"
    dependsOn: [curate-check, curate-fix, pool-gate]
    condition:
      kind: shell
      options:
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-curate-check "${vars.work_dir}" "${vars.run_date}" --final

  - id: script-write
    description: "Author the master script plan (intro/outro, lead/insight/card per doc id, cover, cards, social, excluded) from the curated plan via agent.run; onError: continue — a failed plan falls back to templates (F613, 0345 R9/R10)"
    dependsOn: [script-style, curate-final, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: >-
          test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS
          && test "${vars.script_write_enabled}" = "true"
          && test "${vars.language}" = "zh"
          && ! test -s "${vars.work_dir}/24-script/${vars.run_date}_08_script-write_plan.json"
    action:
      kind: agent.run
      onError: continue
      options:
        role: scribe
        agent: ${vars.agent}
        timeoutMs: 600000
        # ADR-115 error tier: keep this prompt <= 1000 chars.
        input: |
          Follow mode `write` in ${vars.work_dir}/20-editorial/news-editorial/SKILL.md (ADR-045: the kk:news-editorial skill owns selection, balance, style contract and the master output shape; read its references first).
          --in ${vars.work_dir}/21-plan/${vars.run_date}_03_plan_plan.json (don't edit it)
          --excluded ${vars.work_dir}/21-plan/${vars.run_date}_03_curate_excluded.json
          --out ${vars.work_dir}/24-script/${vars.run_date}_08_script-write_plan.json
          Output only the JSON file.
        expectFile: ${vars.work_dir}/24-script/${vars.run_date}_08_script-write_plan.json
        allowAppend: false

  - id: script-check
    description: "0345 R4: dry-run the dailynews-gen validator on the script plan; writes _08_script-write_errors.json when it is missing or rejected"
    dependsOn: [script-style, script-write, pool-gate]
    condition:
      kind: shell
      options:
        command: >-
          test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS
          && test "${vars.script_write_enabled}" = "true"
          && test "${vars.language}" = "zh"
    action:
      kind: shell
      onError: continue
      options:
        command: >-
          kk stage daily-script-check "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}"

  - id: script-write-fix
    description: "0345 R4: one targeted kk:news-editorial `write --fix` pass on validator errors; onError: continue — still-rejected plans fall back to templates"
    dependsOn: [script-check, curate-final, pool-gate]
    condition:
      kind: shell
      options:
        command: >-
          test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS
          && test -s "${vars.work_dir}/24-script/${vars.run_date}_08_script-write_errors.json"
    action:
      kind: agent.run
      onError: continue
      options:
        role: scribe
        agent: ${vars.agent_retry}
        timeoutMs: 600000
        # ADR-115 error tier: keep this prompt <= 1000 chars.
        input: |
          Follow mode `write --fix` in ${vars.work_dir}/20-editorial/news-editorial/SKILL.md (read its references first).
          --in ${vars.work_dir}/21-plan/${vars.run_date}_03_plan_plan.json (don't edit it)
          --excluded ${vars.work_dir}/21-plan/${vars.run_date}_03_curate_excluded.json
          Previous plan (may be absent): ${vars.work_dir}/24-script/${vars.run_date}_08_script-write_plan.json
          --fix ${vars.work_dir}/24-script/${vars.run_date}_08_script-write_errors.json
          --out ${vars.work_dir}/24-script/${vars.run_date}_08_script-write_plan.json (overwrite it with the full corrected plan)
          Output only the JSON file.
        expectFile: ${vars.work_dir}/24-script/${vars.run_date}_08_script-write_plan.json
        allowAppend: false

  - id: editorial-judge
    description: "0345 R11: advisory kk:content-judge evaluation of the script plan under the news-balance rubric; nothing depends on it for control flow"
    dependsOn: [script-check, script-write-fix, curate-final, pool-gate]
    condition:
      kind: shell
      options:
        command: >-
          test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS
          && test -s "${vars.work_dir}/24-script/${vars.run_date}_08_script-write_plan.json"
    action:
      kind: agent.run
      onError: continue
      options:
        role: reviewer
        agent: ${vars.agent}
        timeoutMs: 600000
        # ADR-115 error tier: keep this prompt <= 1000 chars.
        input: |
          You are an LLM-as-judge evaluating a daily news script plan for the knowledge-kit pipeline.
          Content to evaluate: ${vars.work_dir}/24-script/${vars.run_date}_08_script-write_plan.json
          Plan docs reference: ${vars.work_dir}/21-plan/${vars.run_date}_03_plan_plan.json
          Rubric: news-balance
          Output verdict to: ${vars.work_dir}/24-script/${vars.run_date}_08_editorial-judge_verdict.json
          Load the rubric definition from plugins/kk/skills/content-judge/references/rubrics.md (section: news-balance) and the contract from plugins/kk/skills/content-judge/SKILL.md.
          Evaluate the script plan against every criterion in news-balance (news-first, commentary-share, no-restatement, tech-depth, ordering).
          Write the verdict JSON (with confidence HIGH | MEDIUM | LOW) to ${vars.work_dir}/24-script/${vars.run_date}_08_editorial-judge_verdict.json.
        expectFile: ${vars.work_dir}/24-script/${vars.run_date}_08_editorial-judge_verdict.json
        allowAppend: false

  - id: script
    description: >-
      Compile the episode plan Doc[] into structured broadcast VoiceScript YAML Content. Depends on
      `curate-final` so the node still runs when the plan-authoring nodes were disabled or skipped (the
      builder falls back to templates) — but not when the whole content branch is skipped.
    dependsOn: [curate-final, script-style, script-write, script-check, script-write-fix, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-script "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}" "${vars.language}" "${vars.title}" "${vars.voice_profile}" "${vars.episode_max_minutes}" "${vars.vdriver}"

  - id: editorial-render
    description: "0345 R10: deterministically render the prose article body, cover brief, XHS card plan and social posts from the master script plan and curated plan"
    dependsOn: [script, curate-final, pool-gate]
    condition:
      kind: shell
      options:
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-editorial-render "${vars.work_dir}" "${vars.run_date}" "${vars.cards_enabled}" "${vars.cards}"

  - id: article
    description: >-
      Generate the dated daily article Content from the episode plan and rendered article body (daily-article-gen).
    dependsOn: [qc-content, curate-final, editorial-render, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-article "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}"

  - id: cover
    description: "Render the daily cover through the pinned quasi-news podcast presets (F614, 0349: daily-news-podcast-cover x quasi-news-podcast)"
    dependsOn: [editorial-render, pool-gate]
    condition:
      kind: shell
      options:
        command: >-
          test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS
          && test "${vars.cover_enabled}" = "true"
          && test ! -f "${vars.work_dir}/23-cover/${vars.run_date}_07_cover_cover.png"
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-cover "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}" "${vars.cover_provider}" "${vars.cover_model}" "${vars.cover_fallback}"

  - id: cover-normalize
    description: "Normalize the rendered cover (dimensions/format pins) so every consumer sees the same asset"
    dependsOn: [cover]
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-cover-normalize "${vars.work_dir}" "${vars.run_date}"

  # ---- content safety: a nested state machine (no sub-workflow action exists; ADR-031) ----

  - id: safety
    description: >-
      Content safety as a nested state machine (kk-daily-safety.yaml): review → judge → bounded
      revise loop → clean|block. It blocks here (and only here), so a non-zero exit means the drafts
      must not publish — `block` or an integrity failure. The launcher vars the parent run exports
      are stripped at the nested-spur boundary (the same two `NESTED_SPUR_UNSET` vars the stage
      runner strips, kk-workflow-stages.ts): without it `spur workflow run` refuses to start inside
      an active run. voice3 always runs the gate: it is the only check between an LLM draft and a
      published post.
    dependsOn: [article, script]
    action:
      kind: shell
      options:
        command: >-
          env -u SPUR_WORKFLOW_RUN_ACTIVE -u SPUR_EXPECTED_DEFINITION_DIGEST
          spur workflow run plugins/kk/workflows/kk-daily-safety.yaml
          --vars "{\"work_dir\":\"${vars.work_dir}\",\"run_date\":\"${vars.run_date}\",\"safety_max_revise\":\"${vars.safety_max_revise}\",\"safety_platforms\":\"${vars.safety_platforms}\",\"agent\":\"${vars.agent}\",\"agent_retry\":\"${vars.agent_retry}\"}"
          --quiet --no-plan

  - id: review
    description: >-
      Operator review of the safety-gated drafts: `pause: true` stops the run here and RESUME is the
      approval (the engine marks a paused node done on resume, so this node carries no action);
      cancelling the run is the rejection. Same contract as voice1's HITL confirmation, now a node
      instead of a state. Skipped when skip_review=true or when there is nothing to publish.
    dependsOn: [safety]
    pause: true
    condition:
      kind: shell
      options:
        command: 'test "${vars.skip_review}" != "true"'

  # ---- audio branch ----
  # wrap-docs must be DECLARED BEFORE generate: the DAG requires nodes in topological order, and
  # generate consumes wrap-docs's _10_wrap-docs_docs.json as its TTS input (0212 dogfood finding —
  # an edge to a later-declared node wedges the dispatcher with generate never dispatched).

  - id: wrap-docs
    description: "Wrap VoiceScript into Doc[] input for the voice generator plugin (the generate-side variant input)"
    dependsOn: [script, review, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-wrap-docs "${vars.work_dir}" "${vars.run_date}" "${vars.voice_profile}"

  - id: generate
    description: "Voice tier, primary driver (vars.vdriver — voxcpm; its 40 ms lattice is known and monitored, see the vdriver comment). onError: continue — the fallback siblings below are the loud chain (same pattern as 0238 R2)."
    # wrap-docs is a data dependency, not a sibling: daily-generate reads its _10_wrap-docs_docs.json
    # as the TTS input. Without this edge the two nodes race in the same wave (0212 dogfood finding).
    dependsOn: [script, safety, review, wrap-docs, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      onError: continue
      options:
        command: >-
          OMNIVOICE_SPEED=1.06 kk stage daily-generate "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}" "${vars.transcode_mp3}" "${vars.vdriver}" "1" "${vars.episode_max_minutes}" "${vars.episode_min_minutes}"

  # Driver fallback chain (2026-10-15, operator decision): voxcpm -> gemini -> omni. Each sibling
  # runs the same stage with a pinned driver; its condition re-checks the pool AND that NO upstream
  # driver left a valid, passing whole-document Content (the stage stamps metadata.generator with
  # its plugin id and the cache ignores foreign-driver sections, so a failed attempt can neither be
  # relabeled nor mix voices). Non-final siblings continue on error; the last one is loud.

  - id: generate-fallback
    description: "Voice tier fallback 1: gemini (gemini-tts) when the primary driver left no valid Content — the measured-dry escape hatch from voxcpm's lattice"
    dependsOn: [generate, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: >-
          test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS
          && ! jq -e '(.metadata.generator == "kk:voxcpm-tts" or .metadata.generator == "kk:gemini-tts") and .metadata.qc.passed == true' "${vars.work_dir}/30-audio/${vars.run_date}_11_generate_content.json"
    action:
      kind: shell
      onError: continue
      options:
        command: >-
          kk stage daily-generate "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}" "${vars.transcode_mp3}" "gemini" "1" "${vars.episode_max_minutes}" "${vars.episode_min_minutes}"

  - id: generate-fallback2
    description: "Voice tier fallback 2 (last, loud): omni-voice-gen when neither voxcpm nor gemini delivered"
    dependsOn: [generate-fallback, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: >-
          test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS
          && ! jq -e '(.metadata.generator == "kk:voxcpm-tts" or .metadata.generator == "kk:gemini-tts" or .metadata.generator == "kk:omni-voice-gen") and .metadata.qc.passed == true' "${vars.work_dir}/30-audio/${vars.run_date}_11_generate_content.json"
    action:
      kind: shell
      options:
        command: >-
          OMNIVOICE_SPEED=1.06 kk stage daily-generate "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}" "${vars.transcode_mp3}" "ominivoice" "1" "${vars.episode_max_minutes}" "${vars.episode_min_minutes}"

  # 0329 F15: a script-gate refusal produces no audio, but the sting must not fail the day —
  # the refusal artifact admits intro (and duration closes the run as no-content on it).
  - id: intro
    description: "Prepend the 8s intro sting (intro_music var; empty = skip), update duration/audioPath"
    dependsOn: [generate, generate-fallback, generate-fallback2]
    condition:
      kind: shell
      options:
        command: >-
          test -f "${vars.work_dir}/30-audio/${vars.run_date}_11_generate_content.json"
          -o -f "${vars.work_dir}/30-audio/${vars.run_date}_11_generate_content_duration-refusal.json"
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-intro "${vars.work_dir}" "${vars.run_date}" "${vars.intro_music}"

  # ---- advisory voice audit (2026-10-16): never fails the run ----
  # The 20261015 episode shipped 59 different speakers because an instruct-mode profile pins none,
  # and nothing but a human listening caught it. This grades the final render by per-segment median
  # F0 (a speaker change swings it tens of Hz) and prints the table plus a PASS/FAIL line. It is
  # deliberately advisory: `|| true` keeps its non-zero exit out of the run, and onError covers a
  # missing venv (the check needs librosa from the voxcpm plugin's environment).

  - id: voice-audit
    description: "Advisory speaker-consistency audit of the joined episode (warn-only, never fails the run)"
    dependsOn: [intro]
    condition:
      kind: shell
      options:
        command: >-
          test -f "${vars.work_dir}/30-audio/${vars.run_date}_11_generate_content.json"
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-voice-audit "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}"
      onError: continue

  - id: duration
    description: "Measured duration gate: under episode_min_minutes the run refuses and closes as no-content (refusal artifact + emptied candidates + publish-path invalidation, exit 0 — 0266/0329); above episode_max_minutes it still fails loud. Duration is authoritative."
    dependsOn: [intro]
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-episode-duration "${vars.work_dir}" "${vars.run_date}" "${vars.episode_min_minutes}" "${vars.episode_max_minutes}" "${vars.vdriver}" "${vars.__runId}"

  - id: quality
    description: >-
      Print the daily QC table (daily-quality-report) and then gate on it (0329 F23): the print
      alone never gated anything — a 41/100 episode sailed into show-notes, the bundle and the
      publish windows. The verdict stage fails loud when the generator's audio qc verdict is
      missing or `passed` is false, so a bad episode dies here instead of at a tier-0 send.
    dependsOn: [duration, wrap-docs, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-quality-report "${vars.work_dir}" "${vars.run_date}"
          && kk stage run daily-quality-verdict "${vars.work_dir}" "${vars.run_date}"

  - id: show-notes
    description: >-
      Render timeline show notes from the episode plan — content, not publishing: the publish half
      ships them as the episode variant's `metadata.showNotes`, and the link placeholders stay
      unresolved until a send resolves them.
    dependsOn: [quality, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-show-notes "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}" "${vars.title}"

  # 0329 F02: voice3 lost daily-publish-prep in the migration (voice2 keeps it at its :704), so
  # `31-publish/<date>_13_publish-prep_content.json` — the episode variant's source — was never
  # written by this workflow, and a freeze only succeeded against a stale same-day voice2 prep
  # file. Rebuilt per the voice2 template: after duration (it reads the generate content's
  # mp3Path, and ID3 stamps must land on the final post-intro MP3), pool-gated so a refused
  # episode packages nothing.
  - id: publish-prep
    description: >-
      Package the publish-ready episode Content (ID3 tags on the final post-intro MP3, cover
      path, article link) into 31-publish/<date>_13_publish-prep_content.json — the episode
      variant's source for bundle-variants.
    dependsOn: [duration, article, safety, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage daily-publish-prep "${vars.work_dir}" "${vars.run_date}" "${vars.podcast_artist}" "${vars.podcast_album}"
  - id: cards-render
    description: "Render the card series through the pinned xhs-card/xhs-knowledge presets, attach the episode cover last and pair every image with its numbered line (0235 note_scope=episode); onError: continue — the publish node names the missing series and stays soft"
    dependsOn: [editorial-render, review, pool-gate]
    # Each card node keeps its own switch: without it a run with cards_enabled=false would
    # re-package a stale same-day 25-xhs/ series. The pool guard is `pool-gate`'s alone in voice3 (0324 R3).
    condition:
      kind: shell
      options:
        command: 'test "${vars.cards_enabled}" = "true" && test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      onError: continue
      options:
        command: >-
          kk stage daily-xhs-render "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}" "${vars.cards}" "${vars.xhs_style}" "${vars.xhs_provider}" "${vars.xhs_model}" "${vars.xhs_fallback}" "episode"

  # ---- generate-side payloads and the frozen bundle (0324 R2/R3) ----

  - id: bundle-variants
    description: >-
      Build the channel payloads from the run's own artifacts (0327 builders): `30-variants/<key>`
      for article / episode / cards plus the channel-specific keys and the social posts, all with
      `{{article_url}}` / `{{podcast_url}}` placeholders because nothing is published yet. 0329
      F16: depends on every producer it reads (the 0324 file order alone was not a guarantee),
      wipes stale variants first, and follows the cards/cover switches so a disabled producer's
      variant is a skip, not a stale re-read.
    dependsOn: [quality, editorial-render, publish-prep, cover-normalize, cards-render, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage run daily-bundle-variants "${vars.work_dir}" "${vars.run_date}" "${vars.plugins_path}"
          "${vars.cards_enabled}" "${vars.cover_enabled}"

  - id: safety-variants
    description: >-
      Final-variant safety review through the same nested kk-daily-safety machine (0331): the
      manifest stage registers every `30-variants/*.content.json` first, then the machine runs in
      the variants scope (`safety_scope_dir=4-safety-variants` re-roots its stages, guards and
      prompts; the drafts review above is untouched). On an admitted outcome the machine leaves
      `4-safety-variants/safety.json` — status, exclusion record and the sha256 of every reviewed
      variant's current bytes — which publish-matrix-bundle freezes into the bundle so live
      launches and social edits are gated on exactly the reviewed bytes. Fails closed: a block or
      an integrity failure fails this node (the drafts scope's non-zero = never publish contract).
    dependsOn: [bundle-variants, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          kk stage run daily-safety-manifest "${vars.work_dir}" "${vars.run_date}" &&
          env -u SPUR_WORKFLOW_RUN_ACTIVE -u SPUR_EXPECTED_DEFINITION_DIGEST
          spur workflow run plugins/kk/workflows/kk-daily-safety.yaml
          --vars "{\"work_dir\":\"${vars.work_dir}\",\"run_date\":\"${vars.run_date}\",\"safety_max_revise\":\"${vars.safety_max_revise}\",\"safety_platforms\":\"${vars.safety_platforms}\",\"agent\":\"${vars.agent}\",\"agent_retry\":\"${vars.agent_retry}\",\"safety_scope_dir\":\"4-safety-variants\"}"
          --quiet --no-plan

  - id: bundle-freeze
    description: >-
      Freeze `bundle.json` (0321 `BundleSchema`): every `30-variants/*` file with its sha256 plus the
      episode title, so the publish half can run later, or three times a day, against exactly these
      bytes. Fails when the article or episode variant is missing — a bundle never advertises what
      generate did not produce. 0329 F15: token-gated, so a refused episode never freezes — the
      duration gate also drops this run's bundle.json on a refusal. 0331: after safety-variants, so
      the freeze reads the review's evidence (or the bundle stays without it, on a skipped run).
    dependsOn: [bundle-variants, safety-variants, pool-gate]
    condition:
      kind: shell
      options:
        # 0324 R3: the pool verdict is `pool-gate`'s token, never a repeated `kk store pool-count`.
        command: 'test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          case "${vars.publish_preset}" in '') ARGS='' ;; *) ARGS="--preset ${vars.publish_preset}" ;; esac;
          kk stage run publish-matrix-bundle "${vars.work_dir}" --run-date "${vars.run_date}" --run-id "${vars.__runId}" $ARGS

  - id: generation-report
    description: "The generate half's report (the publish half writes its own, per window). 0329 F15: real run-report flags — the phantom skip flag made every invocation exit 1; the pool/candidates/qc inputs are what let the report record a no-content close. Depends on pool-gate beside bundle-freeze: pool-gate always completes, so the report (and the ledger after it) also land on a no-content close — the design requires the report reachable from extract/QC/no-content, not only bundle-freeze."
    dependsOn: [bundle-freeze, pool-gate]
    action:
      kind: shell
      options:
        command: >-
          kk daily run-report --work-dir "${vars.work_dir}" --run-date "${vars.run_date}"
          --pool "${vars.work_dir}/10-collect/pool.json"
          --candidates "${vars.work_dir}/21-plan/${vars.run_date}_04_quality-control-content_candidates.json"
          --plugins-path "${vars.plugins_path}"
          --qc-min-quality "${vars.qc_min_quality}" --qc-min-importance "${vars.qc_min_importance}"
          --qc-min-urgency "${vars.qc_min_urgency}" --qc-min-impact "${vars.qc_min_impact}"

  - id: publish
    description: >-
      Nested `kk-daily-publish3` launch when `auto_publish=true` (0324 R4): the after-generate
      window against the bundle this run just froze. The launcher vars are stripped at the nested
      boundary (the same two voice2 strips for the safety machine), and the nested run's exit code is
      surfaced — a failed publish window is a failed generate run's last step, never a silent one.
    dependsOn: [generation-report, pool-gate]
    condition:
      kind: shell
      options:
        command: 'test "${vars.auto_publish}" = "true" && test "$(cat ".spur/run/${vars.__runId}-pool-gate.status" 2>/dev/null)" = PASS'
    action:
      kind: shell
      options:
        command: >-
          env -u SPUR_WORKFLOW_RUN_ACTIVE -u SPUR_EXPECTED_DEFINITION_DIGEST
          spur workflow run plugins/kk/workflows/kk-daily-publish3.yaml
          --vars "{\"work_dir\":\"${vars.work_dir}\",\"run_date\":\"${vars.run_date}\",\"window\":\"${vars.publish_window}\",\"preset\":\"${vars.publish_preset}\",\"dummy\":\"${vars.publish_dummy}\",\"live_channels\":\"${vars.publish_live_channels}\"}"

  - id: ledger
    description: >-
      Backfill the voice3 ledger with every finished run it does not record yet (an in-run
      `kk ledger append` of this run always refuses with `kk.ledger.run.running`; the scheduled
      wrapper's post-run sync records this one). `|| true` — bookkeeping never fails a generation.
    dependsOn: [generation-report, publish]
    action:
      kind: shell
      options:
        command: 'kk ledger sync --workflow kk-daily-ai-voice3 || true'
