---
"$schema": "@gobing-ai/spur/schemas/state-machine-workflow.schema.json"
name: kk-solo-podcast
kind: state-machine
description: >-
  Solo podcast authoring pipeline over the kk:audio-authoring skill, Spur HITL gates,
  and voice-gen audio generation
initialState: prepare
terminalStates:
  - done
  - failed
failureStates:
  - failed

vars:
  topic: ""
  input_file: ""
  work_dir: ""
  force: "false"
  outline: ""
  script_approved: ""
  target_duration_min: "8"
  words_per_min: "150"
  cjk_chars_per_min: "220"
  voice_profile: ""
  language: "en"
  plugins_path: ""
  validate_script: ""
  agent: ""
  wrap_script: ""
  __hitlAnswer: ""
  __hitlInput: ""

states:
  - id: prepare
    description: "mkdir work_dir and stage subdirectories; validate XOR topic/input_file and voice_profile; write brief.md"
    onEnter:
      - kind: shell
        options:
          # ADR-115: the XOR / voice_profile / overwrite / brief logic lives in the
          # solo-podcast stage runner; this action only resolves the package root and
          # delegates (one logical call).
          command: >-
            kbin="$(command -v kk 2>/dev/null)";
            while [ -L "$kbin" ]; do link="$(readlink "$kbin")"; case "$link" in /*) kbin="$link";; *) kbin="$(dirname "$kbin")/$link";; esac; done;
            pkg="$(dirname "$(dirname "$kbin")")";
            st="$pkg/plugins/kk/scripts/kk-workflow-stages.ts";
            [ -f "$st" ] || echo "kk-workflow-stages.ts not found at $st — install or refresh the kk package (bun link in a checkout)" >&2;
            bun "$st" prepare-solo "${vars.work_dir}" "${vars.topic}" "${vars.input_file}" "${vars.voice_profile}" "${vars.force}"

  - id: understand
    description: "Analyze brief and generate podcast briefing (agent.run)"
    onEnter:
      - kind: agent.run
        options:
          role: scribe
          agent: ${vars.agent}
          input: |
            Invoke the kk:audio-authoring skill: operation `briefing`, mode `solo`.
            Read the source brief at ${vars.work_dir}/brief.md.
            Write a concise podcast briefing at ${vars.work_dir}/1-briefing-briefing.md.
            Identify core thesis, key listener takeaways, audience profile, target spoken duration (${vars.target_duration_min} minutes), tone, and what material from the brief to emphasize or cut.
            Flags: --dir ${vars.work_dir} --duration ${vars.target_duration_min}
          expectFile: ${vars.work_dir}/1-briefing-briefing.md

  - id: outline-write
    description: "Generate spoken podcast outline options (agent.run)"
    onEnter:
      - kind: agent.run
        options:
          role: scribe
          agent: ${vars.agent}
          input: |
            Invoke the kk:audio-authoring skill: operation `outline`, mode `solo`.
            Read the briefing at ${vars.work_dir}/1-briefing-briefing.md and brief at ${vars.work_dir}/brief.md.
            Generate spoken podcast outline options in ${vars.work_dir}/2-outline/:
            - outline-option-a.md (e.g. narrative / storytelling arc)
            - outline-option-b.md (e.g. analytical / explainer breakdown)
            - optional outline-option-c.md
            Target total episode spoken duration is ${vars.target_duration_min} minutes.
            Do not wait for operator selection; write the option files.
            Flags: --dir ${vars.work_dir} --duration ${vars.target_duration_min}
          expectFile: ${vars.work_dir}/2-outline/outline-option-a.md
      - kind: shell
        options:
          command: >-
            test -f "${vars.work_dir}/2-outline/outline-option-b.md" || { echo "missing required outline-option-b.md" >&2; exit 1; }

  - id: outline-select
    description: "Operator selects preferred outline option"
    pause: true
    onEnter:
      - kind: hitl.select
        options:
          prompt: "Select an approved outline option from ${vars.work_dir}/2-outline/ (outline-option-a.md, outline-option-b.md, or outline-option-c.md):"
          options:
            - a
            - b
            - c
          var: __hitlAnswer

  - id: outline-commit
    description: "Copy selected outline to outline-approved.md"
    onEnter:
      - kind: shell
        options:
          command: >-
            sel="${vars.outline}";
            if [ -z "$sel" ]; then sel="${vars.__hitlAnswer}"; fi;
            if [ -z "$sel" ]; then sel="a"; fi;
            src="${vars.work_dir}/2-outline/outline-option-$sel.md";
            if [ ! -f "$src" ]; then
              echo "selected outline file not found: $src" >&2; exit 1;
            fi;
            cp "$src" "${vars.work_dir}/2-outline/outline-approved.md";

  - id: script-write
    description: "Author complete VoiceScript YAML from approved outline (agent.run)"
    onEnter:
      - kind: agent.run
        options:
          role: scribe
          agent: ${vars.agent}
          # ADR-115 (R3): the VoiceScript field contract is the skill's own
          # templates/voicescript.solo.yaml (task 0081) — not duplicated here. The prompt
          # stays a bounded skill invocation: operation + inputs + output path + budget.
          input: |
            Invoke the kk:audio-authoring skill: operation `script`, mode `solo`.
            Inputs: briefing ${vars.work_dir}/1-briefing-briefing.md; approved outline ${vars.work_dir}/2-outline/outline-approved.md; revision feedback ${vars.__hitlInput}.
            Contract: the skill's templates/voicescript.solo.yaml — `language: "${vars.language}"`, `segments` of spoken text; no `default_profile`, no `title`, no invented fields.
            Budget: ${vars.target_duration_min} min — zh/ja/ko ${vars.cjk_chars_per_min} chars/min, else ${vars.words_per_min} words/min; within ±20%, one speaker.
            Write ONLY the YAML (no fences, no repo paths) to ${vars.work_dir}/3-script-voicescript.yaml.
            Flags: --dir ${vars.work_dir} --duration ${vars.target_duration_min} --language ${vars.language} --profile ${vars.voice_profile} --revise "${vars.__hitlInput}"; add --force when ${vars.work_dir}/.duration-feedback exists (its contents are the revision feedback).
          expectFile: ${vars.work_dir}/3-script-voicescript.yaml

  - id: script-validate
    description: "Validate authored VoiceScript YAML structure and constraints"
    onEnter:
      - kind: shell
        options:
          # ADR-115: package-root resolution + delegation to validate-voicescript.ts
          # (override chain preserved inside the stage runner).
          command: >-
            kbin="$(command -v kk 2>/dev/null)";
            while [ -L "$kbin" ]; do link="$(readlink "$kbin")"; case "$link" in /*) kbin="$link";; *) kbin="$(dirname "$kbin")/$link";; esac; done;
            pkg="$(dirname "$(dirname "$kbin")")";
            st="$pkg/plugins/kk/scripts/kk-workflow-stages.ts";
            [ -f "$st" ] || echo "kk-workflow-stages.ts not found at $st — install or refresh the kk package (bun link in a checkout)" >&2;
            bun "$st" validate "${vars.validate_script}" --in "${vars.work_dir}/3-script-voicescript.yaml"

  - id: script-review
    description: "Operator reviews and approves VoiceScript before live TTS generation"
    pause: true
    onEnter:
      - kind: hitl.confirm
        options:
          prompt: "Review VoiceScript at ${vars.work_dir}/3-script-voicescript.yaml. Approve for voice generation?"
          var: __hitlAnswer

  - id: script-revise
    description: "Collect revision feedback from operator (bounded by 3 rounds)"
    pause: true
    onEnter:
      - kind: shell
        options:
          command: >-
            rm -f "${vars.work_dir}/.duration-feedback";
            n=$(cat "${vars.work_dir}/.revise-count" 2>/dev/null || echo 0);
            echo $((n + 1)) > "${vars.work_dir}/.revise-count";
      - kind: hitl.input
        options:
          prompt: "Provide specific revision feedback for ${vars.work_dir}/3-script-voicescript.yaml:"
          var: __hitlInput

  - id: wrap-docs
    description: "Wrap VoiceScript into Doc[] JSON for voice-gen generator plugin"
    onEnter:
      - kind: shell
        options:
          # ADR-115: package-root resolution + delegation to wrap-voicescript-doc.ts
          # (override chain preserved inside the stage runner).
          command: >-
            kbin="$(command -v kk 2>/dev/null)";
            while [ -L "$kbin" ]; do link="$(readlink "$kbin")"; case "$link" in /*) kbin="$link";; *) kbin="$(dirname "$kbin")/$link";; esac; done;
            pkg="$(dirname "$(dirname "$kbin")")";
            st="$pkg/plugins/kk/scripts/kk-workflow-stages.ts";
            [ -f "$st" ] || echo "kk-workflow-stages.ts not found at $st — install or refresh the kk package (bun link in a checkout)" >&2;
            bun "$st" wrap "${vars.wrap_script}" --in "${vars.work_dir}/3-script-voicescript.yaml" --out "${vars.work_dir}/4-audio/docs.json" --profile "${vars.voice_profile}"

  - id: generate
    description: "Invoke voice-gen generator plugin to generate audio"
    onEnter:
      - kind: shell
        options:
          command: >-
            set -e;
            extra="";
            if [ -n "${vars.plugins_path}" ]; then extra="--plugins-path ${vars.plugins_path}"; fi;
            kk executor run voice-gen --in "${vars.work_dir}/4-audio/docs.json" --out "${vars.work_dir}/4-audio/content.json" $extra

  - id: duration-check
    description: "Validate generated audio duration against target budget; miss writes .duration-feedback for the retry edge"
    onEnter:
      - kind: shell
        options:
          # ADR-115: the band math, .duration-feedback, and .revise-count bump live in
          # the solo-podcast stage runner; the transition guards below still branch on
          # .duration-ok.
          command: >-
            kbin="$(command -v kk 2>/dev/null)";
            while [ -L "$kbin" ]; do link="$(readlink "$kbin")"; case "$link" in /*) kbin="$link";; *) kbin="$(dirname "$kbin")/$link";; esac; done;
            pkg="$(dirname "$(dirname "$kbin")")";
            st="$pkg/plugins/kk/scripts/kk-workflow-stages.ts";
            [ -f "$st" ] || echo "kk-workflow-stages.ts not found at $st — install or refresh the kk package (bun link in a checkout)" >&2;
            bun "$st" duration "${vars.work_dir}" "${vars.target_duration_min}"

  - id: done
    description: "Terminal — Solo podcast VoiceScript and audio generated successfully"
  - id: failed
    description: "Terminal — Solo podcast workflow failed or rejected"

transitions:
  - from: prepare
    to: understand
    description: "Prepare completed -> begin briefing analysis"
    guard:
      kind: always

  - from: understand
    to: outline-write
    description: "Briefing completed -> generate outline options"
    guard:
      kind: always

  - from: outline-write
    to: outline-select
    description: "Outline not pre-selected -> pause for operator selection"
    guard:
      kind: shell
      options:
        command: 'test -z "${vars.outline}"'

  - from: outline-write
    to: outline-commit
    description: "Outline pre-selected -> skip interactive selection"
    guard:
      kind: shell
      options:
        command: 'test -n "${vars.outline}"'

  - from: outline-select
    to: outline-commit
    description: "Outline selected -> commit approved outline"
    guard:
      kind: always

  - from: outline-commit
    to: script-write
    description: "Approved outline committed -> write VoiceScript"
    guard:
      kind: always

  - from: script-write
    to: script-validate
    description: "VoiceScript written -> validate structure and caps"
    guard:
      kind: always

  - from: script-validate
    to: wrap-docs
    description: "script_approved pre-set -> skip script review (CI/dry-run)"
    guard:
      kind: shell
      options:
        command: 'test "${vars.script_approved}" = "true"'
  - from: script-validate
    to: script-review
    description: "VoiceScript validation passed -> pause for operator review"
    guard:
      kind: always

  - from: script-review
    to: wrap-docs
    description: "VoiceScript approved -> wrap into Doc[] for generation"
    guard:
      kind: shell
      options:
        command: '{ test -z "${vars.__hitlAnswer}" || test "${vars.__hitlAnswer}" = "yes"; }'

  - from: script-review
    to: script-revise
    description: "VoiceScript rejected with revision budget remaining -> collect feedback"
    guard:
      kind: shell
      options:
        command: 'test "${vars.__hitlAnswer}" = "no" && test "$(cat "${vars.work_dir}/.revise-count" 2>/dev/null || echo 0)" -lt 3'

  - from: script-review
    to: failed
    description: "VoiceScript rejected with revision budget exhausted -> fail"
    guard:
      kind: shell
      options:
        command: 'test "${vars.__hitlAnswer}" = "no" && test "$(cat "${vars.work_dir}/.revise-count" 2>/dev/null || echo 0)" -ge 3'

  - from: script-revise
    to: script-write
    description: "Feedback collected -> rewrite VoiceScript"
    guard:
      kind: always

  - from: wrap-docs
    to: generate
    description: "Doc[] wrapped -> invoke voice-gen"
    guard:
      kind: always

  - from: generate
    to: duration-check
    description: "Voice generation finished -> verify duration"
    guard:
      kind: always

  - from: duration-check
    to: done
    description: "Audio duration within [0.5x, 2.0x] band or missing content.json in dry-run -> complete"
    guard:
      kind: shell
      options:
        command: 'test ! -f "${vars.work_dir}/4-audio/content.json" || test -f "${vars.work_dir}/4-audio/.duration-ok"'

  - from: duration-check
    to: script-write
    description: "Audio duration outside band with revision budget remaining -> regenerate script from feedback"
    guard:
      kind: shell
      options:
        command: 'test -f "${vars.work_dir}/4-audio/content.json" && test ! -f "${vars.work_dir}/4-audio/.duration-ok" && test "$(cat "${vars.work_dir}/.revise-count" 2>/dev/null || echo 0)" -lt 3'

  - from: duration-check
    to: failed
    description: "Audio duration outside band with revision budget exhausted -> fail"
    guard:
      kind: shell
      options:
        command: 'test -f "${vars.work_dir}/4-audio/content.json" && test ! -f "${vars.work_dir}/4-audio/.duration-ok" && test "$(cat "${vars.work_dir}/.revise-count" 2>/dev/null || echo 0)" -ge 3'
