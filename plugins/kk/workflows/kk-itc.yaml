---
name: kk-itc
kind: dag
version: "2"
description: >-
  IT content authoring and publication DAG: prepare -> child authoring FSM -> verify-child-freeze
  -> illustration/SEO branches -> materialize & plan -> target check -> fan-out send -> reconcile-settle -> report

vars:
  # Config-backed options default to "" so `workflows.kk-itc` and compiled defaults apply (0303);
  # the frozen `$work_dir/itc-options.json` is the single source every downstream node reads.
  topic: ""
  input_file: ""
  from_collect: ""
  topic_profile: ""
  run_date: ""
  work_dir: ""
  writer: ""
  playbook: ""
  rubric: "tech-accuracy"
  outline: ""
  outline_bullets_only: ""
  plan_only: "false"
  research: ""
  judge: ""
  auto: ""
  unslop: ""
  force: "false"
  max_revisions: ""
  source_locale: ""
  publish_targets: ""
  publish_preset: ""
  publish_live: ""
  cover_enabled: ""
  inline_images: ""
  seo_mode: ""
  agent: "inline"
  __runId: ""
  __definitionDigest: ""

nodes:
  - id: executor-probe
    description: "One real prompt to the resolved executor; a dead executor fails the run here (ADR-053 §5)"
    action:
      kind: agent.run
      options:
        role: scribe
        agent: ${vars.agent}
        timeoutMs: 120000
        input: "Reply with exactly: OK"

  - id: prepare
    description: "Freeze the effective options (itc-prepare) bound to this run, then prepare the brief"
    dependsOn: [executor-probe]
    action:
      kind: shell
      options:
        # The entry normally freezes itc-options.json before launch (a collected topic must be
        # chosen first); a direct launch freezes it here. A snapshot from another run is refused.
        command: |
          wd="${vars.work_dir}"; run="${vars.__runId}"; o="$wd/itc-options.json"
          test -n "$wd" || { echo "work_dir is required (derive it with kk stage run itc-prepare)" >&2; exit 1; }
          if [ ! -f "$o" ]; then
            req="$(mktemp)"
            jq -n --arg topic "${vars.topic}" --arg inputFile "${vars.input_file}" --arg fromCollect "${vars.from_collect}" \
              --arg topicProfile "${vars.topic_profile}" --arg runDate "${vars.run_date}" --arg workDir "$wd" --arg parentRunId "$run" \
              --arg writer "${vars.writer}" --arg playbook "${vars.playbook}" --arg sourceLocale "${vars.source_locale}" \
              --arg publishTargets "${vars.publish_targets}" --arg publishPreset "${vars.publish_preset}" --arg seo "${vars.seo_mode}" \
              --arg maxRevisions "${vars.max_revisions}" --arg research "${vars.research}" --arg judge "${vars.judge}" \
              --arg auto "${vars.auto}" --arg unslop "${vars.unslop}" --arg force "${vars.force}" --arg publishLive "${vars.publish_live}" \
              --arg coverEnabled "${vars.cover_enabled}" --arg inlineImages "${vars.inline_images}" \
              '$ARGS.named | with_entries(select(.value != ""))
                | with_entries(if (.key | IN("research","judge","auto","unslop","force","publishLive","coverEnabled","inlineImages"))
                    then .value = (.value == "true") else . end)
                | if has("maxRevisions") then .maxRevisions |= tonumber else . end' > "$req" || { rm -f "$req"; exit 1; }
            kk stage run itc-prepare --request "$req" > /dev/null; rc=$?; rm -f "$req"; test "$rc" -eq 0 || exit 1
          fi
          test -f "$o" || { echo "a collected topic must be chosen before launch: run the entry's intake, then itc-prepare --chosen" >&2; exit 1; }
          pr=$(jq -r '.parentRunId' "$o")
          if [ "$pr" != "$run" ] && [ "${vars.force}" != "true" ]; then
            echo "$o belongs to run '$pr', not '$run'; pass force=true to adopt it" >&2; exit 1
          fi
          kind=$(jq -r '.sourceKind' "$o"); val=$(jq -r '.sourceValue' "$o")
          case "$kind" in
            input_file) kk stage run prepare-itc "$wd" "" "$val" "${vars.force}" ;;
            from_collect) kk stage run prepare-itc "$wd" "$(jq -r '.displayTitle' "$o")" "" "${vars.force}" ;;
            *) kk stage run prepare-itc "$wd" "$val" "" "${vars.force}" ;;
          esac

  - id: child-author
    description: "Run child authoring state machine (outline -> draft -> unslop -> review/judge)"
    dependsOn:
      - prepare
    action:
      kind: shell
      options:
        # The child id is derived from the parent before launch, so an interrupted parent queries
        # and continues the SAME child instead of starting a second one; a paused child stays a
        # distinct non-success for the parent until it is answered and reaches done. The child
        # runs as an owned process: a cancelled parent signals it and cancels its run.
        command: |
          cid="${vars.__runId}-author"
          v=$(jq -c --arg wd "${vars.work_dir}" --arg agent "${vars.agent}" --arg rubric "${vars.rubric}" --arg outline "${vars.outline}" \
            --arg ob "${vars.outline_bullets_only}" \
            --arg run "${vars.__runId}" --arg dd "${vars.__definitionDigest}" \
            '{work_dir:$wd, agent:$agent, rubric:$rubric, outline:$outline, writer:.writer, playbook:.playbook,
              outline_bullets_only:(if $ob == "true" then "true" else "false" end),
              auto:(.auto|tostring), unslop:(.unslop|tostring), judge:(.judge|tostring), max_revisions:(.maxRevisions|tostring),
              parent_run_id:$run, child_run_id:($run + "-author"), definition_digest:$dd, options_digest:.optionsDigest}' \
            "${vars.work_dir}/itc-options.json") || exit 1
          # Child definition: the running tree first (a project checkout shadows the install),
          # else the installed kk package root via its real path (the run's cwd may be anywhere).
          wf="plugins/kk/workflows/kk-itc-author.yaml"
          if [ ! -f "$wf" ]; then
            test -x "$(command -v kk)" || { echo "kk-itc-author.yaml not found from the cwd and no kk binary for fallback" >&2; exit 1; }
            kk_pkg="$(dirname "$(dirname "$(python3 -c 'import os,sys;print(os.path.realpath(sys.argv[1]))' "$(command -v kk)")")")"
            wf="$kk_pkg/plugins/kk/workflows/kk-itc-author.yaml"
          fi
          test -f "$wf" || { echo "child workflow not found at $wf (cwd tree or kk package root)" >&2; exit 1; }
          owned() {
            env -u SPUR_WORKFLOW_RUN_ACTIVE -u SPUR_EXPECTED_DEFINITION_DIGEST "$@" &
            pid=$!
            trap 'kill -TERM "$pid" 2>/dev/null; spur workflow cancel "$cid" >/dev/null 2>&1; exit 143' TERM INT HUP
            wait "$pid"; rc=$?
            trap - TERM INT HUP
            return "$rc"
          }
          st=$(spur workflow trace "$cid" --json 2>/dev/null | jq -r '.run.status // empty')
          case "$st" in
            done) exit 0 ;;
            paused) owned spur workflow continue "$cid" --yes ;;
            "") owned spur workflow run "$wf" --run-id "$cid" --vars "$v" ;;
            *) echo "child $cid is $st; refusing to relaunch it" >&2; exit 1 ;;
          esac
          st=$(spur workflow trace "$cid" --json 2>/dev/null | jq -r '.run.status // empty')
          if [ "$st" = paused ]; then echo "child $cid paused: answer it with spur workflow continue $cid, then resume this run" >&2; exit 1; fi
          test "$st" = done || { echo "child $cid ended $st" >&2; exit 1; }

  - id: verify-child-freeze
    description: "Verify child authoring completion receipt and freeze draft/outline digests"
    dependsOn:
      - child-author
    action:
      kind: shell
      options:
        command: >-
          kk stage run itc-author-complete "${vars.work_dir}" "${vars.__runId}"

  - id: illustrate
    description: "Optional cover/inline illustrations via kk:image-authoring — entered only when a spend var is on (R7)"
    dependsOn:
      - verify-child-freeze
    condition:
      kind: shell
      options:
        command: 'jq -e ".coverEnabled or .inlineImages" "${vars.work_dir}/itc-options.json" >/dev/null'
    action:
      kind: agent.run
      options:
        role: scribe
        agent: ${vars.agent}
        input: |
          Invoke the kk:image-authoring skill with KK_NONINTERACTIVE=1 and KK_IMAGE_AUTO_CONFIRM=1 (non-interactive, auto-confirm — the operator approved spend via the cover_enabled/inline_images vars).
          Create ${vars.work_dir}/4-illustrations/ and generate the cover illustration into it as cover.png (cover.jpg acceptable), sized for an article hero image.
          When inline_images=true, also generate inline figures for the draft's key sections as inline-<slug>.png in the same directory.
          Print each written path as the last line of stdout.

  - id: materialize-plan
    description: "Materialize content.json and resolve publication targets into publish-plan.json"
    dependsOn:
      - verify-child-freeze
      - illustrate
    action:
      kind: shell
      options:
        command: >-
          kk stage run itc-materialize-plan "${vars.work_dir}"

  - id: adapt
    description: "Prepare per-platform variant Content files via kk:article-adapt — runs only for adapt:true variants (R9)"
    dependsOn:
      - materialize-plan
    action:
      kind: agent.run
      options:
        role: scribe
        agent: ${vars.agent}
        input: |
          Invoke the kk:article-adapt skill.
          Read ${vars.work_dir}/4-publish/publish-plan.json and, for each entry in variants with adapt=true, read ${vars.work_dir}/4-publish/content.json and write the variant Content file to ${vars.work_dir}/4-publish/<variant.file>.
          Apply the plan's variant limits and translate title and body into the variant's locale. Never set metadata.published; the publishing states set switches.
          Print each written variant file path as the last line of stdout.

  - id: adapt-verify
    description: "Verify adapted variant content files"
    dependsOn:
      - adapt
    action:
      kind: shell
      options:
        command: >-
          test -f "${vars.work_dir}/4-publish/publish-plan.json" || exit 0;
          kk stage run itc-adapt-verify "${vars.work_dir}"

  - id: check-targets
    description: "Check readiness probes for plannable publish targets"
    dependsOn:
      - materialize-plan
    action:
      kind: shell
      options:
        command: >-
          test -f "${vars.work_dir}/4-publish/publish-plan.json" || exit 0;
          kk stage run itc-check-targets "${vars.work_dir}"

  - id: send-confirm
    description: >-
      Operator approval of a send: `pause: true` stops the run and RESUME is the approval
      (no action); cancelling is the rejection. Entered for any plan with targets — a draft
      still creates real remote drafts, not only a LIVE send — and skipped for empty plans
      and plan_only runs (the plan preview is the stop point).
    dependsOn:
      - adapt-verify
      - check-targets
    pause: true
    condition:
      kind: shell
      options:
        # Item 5: draft-only plans with targets also confirm (draft saves are real remote
        # artifacts). plan_only runs stop at the plan instead of pausing for a no-op confirm.
        command: 'jq -e "((.targets // []) | length) > 0" "${vars.work_dir}/4-publish/publish-plan.json" >/dev/null 2>&1 && test "${vars.plan_only}" != "true"'

  - id: fanout-send
    description: "Dispatch target payloads via executor fan-out and record receipts"
    dependsOn:
      - send-confirm
    # plan_only stops after the confirmed plan: no sends, no recovery, no settle.
    condition:
      kind: shell
      options:
        command: 'test "${vars.plan_only}" != "true"'
    action:
      kind: shell
      options:
        command: >-
          test -f "${vars.work_dir}/4-publish/publish-plan.json" || exit 0;
          kk stage run itc-send-targets "${vars.work_dir}"

  - id: fanout-recovery
    description: "Retry safe effect-none target failures once within budget"
    dependsOn:
      - fanout-send
    condition:
      kind: shell
      options:
        command: 'test "${vars.plan_only}" != "true"'
    action:
      kind: shell
      options:
        command: >-
          test -f "${vars.work_dir}/4-publish/publish-plan.json" || exit 0;
          kk stage run itc-send-targets "${vars.work_dir}" --retry

  - id: reconcile-settle
    description: "Reconcile target receipts and settle store selection"
    dependsOn:
      - fanout-recovery
    # plan_only left no receipts to reconcile; with targets present the stage would fail on
    # their absence, so the plan preview ends the run before settle (report still runs).
    condition:
      kind: shell
      options:
        command: 'test "${vars.plan_only}" != "true"'
    action:
      kind: shell
      options:
        command: >-
          kk stage run itc-reconcile-receipts "${vars.work_dir}"

  - id: seo
    description: "Export SEO prepublish request and published pages handoffs"
    dependsOn:
      - verify-child-freeze
    action:
      kind: shell
      options:
        command: >-
          kk stage run itc-export-seo "${vars.work_dir}" "$(jq -r '.seo' "${vars.work_dir}/itc-options.json")"

  - id: report
    description: "Produce final run report summary"
    # Mandatory freeze plus every branch: a skipped optional branch still satisfies the edge,
    # so an all-skipped publication reports, but a report never races an unfinished send.
    dependsOn:
      - verify-child-freeze
      - reconcile-settle
      - seo
    action:
      kind: shell
      options:
        command: >-
          kk stage run itc-report-summary "${vars.work_dir}" "$(jq -r '.maxRevisions' "${vars.work_dir}/itc-options.json")"
