---
"$schema": "@gobing-ai/spur/schemas/state-machine-workflow.schema.json"
name: kk-daily-ai-voice
kind: state-machine
description: >-
  Daily AI news end-to-end pipeline (F61 destination): collect (aihot + last30days + Horizon)
  → blend core facts → article + cover + script + voice → publish (podcast w/ show notes + surfdash)
initialState: prepare
terminalStates:
  - done
  - failed
failureStates:
  - failed

vars:
  work_dir: ""
  limit: "10"
  language: "zh"
  voice_profile: "robin-news"
  title: ""
  cursor: ""
  state_file: ""
  skip_review: "false"
  transcode_mp3: "false"
  cover_enabled: "true"
  plan_max_items: "20"
  plan_translate_enabled: "true"
  plugins_path: ""
  last30days_topic: "AI news"
  horizon_hours: "24"
  publish_enabled: "false"
  last30days_enabled: "false"
  run_date: ""
  agent: "auto"
  surfdash_post_path: ""
  surfdash_en_post_path: ""
  surfdash_ja_post_path: ""
  __hitlAnswer: ""

states:
  - id: prepare
    description: "Create workspace subdirectories and validate parameters; write source configs"
    onEnter:
      - kind: shell
        options:
          command: >-
            test -n "${vars.work_dir}" || { echo "missing required variable: work_dir" >&2 && exit 1; };
            mkdir -p "${vars.work_dir}/1-ingest" "${vars.work_dir}/2-facts" "${vars.work_dir}/2-plan" "${vars.work_dir}/2-article" "${vars.work_dir}/2-cover" "${vars.work_dir}/2-script" "${vars.work_dir}/3-audio" "${vars.work_dir}/3-publish";
            date +%Y%m%d > "${vars.work_dir}/run-date.txt" &&
            bun -e 'await Bun.write(process.argv[1], JSON.stringify({ limit: Number(process.argv[2]), cursor: process.argv[3] || undefined, stateFile: process.argv[4] || undefined }, null, 2))' "${vars.work_dir}/1-ingest/source.json" "${vars.limit}" "${vars.cursor}" "${vars.state_file}" &&
            if [ "${vars.last30days_enabled}" != "true" ]; then printf '[]' > "${vars.work_dir}/1-ingest/last30days-docs.json"; fi &&
            bun -e 'await Bun.write(process.argv[1], JSON.stringify({ topic: process.argv[2] }, null, 2))' "${vars.work_dir}/1-ingest/last30days.json" "${vars.last30days_topic}" &&
            bun -e 'await Bun.write(process.argv[1], JSON.stringify({ hours: Number(process.argv[2]) }, null, 2))' "${vars.work_dir}/1-ingest/horizon.json" "${vars.horizon_hours}"
      - kind: file.read.into-var
        options:
          path: ${vars.work_dir}/run-date.txt
          var: run_date

  - id: fetch
    description: "Ingest latest curated AI news from aihot.virxact.com"
    onEnter:
      - kind: shell
        options:
          command: >-
            set --;
            if [ -n "${vars.plugins_path}" ]; then set -- --plugins-path "${vars.plugins_path}"; fi;
            kk executor run aihot-ingest --in "${vars.work_dir}/1-ingest/source.json" --out "${vars.work_dir}/1-ingest/docs.json" "$@"

  - id: ingest-last30days
    description: "Ingest last-30-days social/news research (last30days skill, degraded keyless without setup)"
    onEnter:
      - kind: shell
        options:
          command: >-
            set --;
            if [ -n "${vars.plugins_path}" ]; then set -- --plugins-path "${vars.plugins_path}"; fi;
            kk executor run last30days-ingest --in "${vars.work_dir}/1-ingest/last30days.json" --out "${vars.work_dir}/1-ingest/last30days-docs.json" "$@"

  - id: ingest-horizon
    description: "Run Horizon crawl and parse the fresh digest into Doc[]"
    onEnter:
      - kind: shell
        options:
          command: >-
            set --;
            if [ -n "${vars.plugins_path}" ]; then set -- --plugins-path "${vars.plugins_path}"; fi;
            HORIZON_OUT="${vars.work_dir}/1-ingest/horizon-docs-${vars.run_date}.json"; if [ -f "$HORIZON_OUT" ]; then echo "horizon cached: $HORIZON_OUT"; exit 0; fi; kk executor run horizon-ingest --in "${vars.work_dir}/1-ingest/horizon.json" --out "$HORIZON_OUT" "$@"

  - id: blend-facts
    description: "Merge all source Doc[] (fan-in) and render the dated core-facts markdown"
    onEnter:
      - kind: shell
        options:
          command: >-
            set --;
            if [ -n "${vars.plugins_path}" ]; then set -- --plugins-path "${vars.plugins_path}"; fi;
            kk executor fan-in --in "${vars.work_dir}/1-ingest/docs.json" --in "${vars.work_dir}/1-ingest/last30days-docs.json" --in "${vars.work_dir}/1-ingest/horizon-docs-${vars.run_date}.json" --out "${vars.work_dir}/1-ingest/blended.json" "$@" &&
            kk executor run core-facts-gen --in "${vars.work_dir}/1-ingest/blended.json" --out "${vars.work_dir}/2-facts/content.json" "$@" &&
            bun -e 'await Bun.write(process.argv[2], (await Bun.file(process.argv[1]).json()).body)' "${vars.work_dir}/2-facts/content.json" "${vars.work_dir}/2-facts/core-facts.md"

  - id: plan
    description: "Score/dedup/select the blended Doc[] into the episode plan (episode-plan-gen)"
    onEnter:
      - kind: shell
        options:
          command: >-
            set --;
            if [ -n "${vars.plugins_path}" ]; then set -- --plugins-path "${vars.plugins_path}"; fi;
            PLAN_CONTENT="${vars.work_dir}/2-plan/content.json"; PLAN_DOCS="${vars.work_dir}/2-plan/plan.json";
            if [ -f "$PLAN_DOCS" ]; then echo "plan cached: $PLAN_DOCS"; exit 0; fi;
            EPISODE_PLAN_MAX_ITEMS="${vars.plan_max_items}" EPISODE_PLAN_DATE="${vars.run_date}" kk executor run episode-plan-gen --in "${vars.work_dir}/1-ingest/blended.json" --out "$PLAN_CONTENT" "$@" &&
            bun -e 'const content = JSON.parse(await Bun.file(process.argv[1]).text()); const docs = content.metadata?.docs; if (!Array.isArray(docs) || docs.length === 0) { console.error("plan: content.metadata.docs missing or empty"); process.exit(1); } await Bun.write(process.argv[2], JSON.stringify(docs, null, 2))' "$PLAN_CONTENT" "$PLAN_DOCS" &&
            test -f "$PLAN_DOCS" || { echo "plan: $PLAN_DOCS not written after episode-plan-gen"; exit 1; }

  - id: plan-translate
    description: "Translate needsTranslation plan items into the output plan.json via agent.run"
    onEnter:
      - kind: agent.run
        options:
          role: scribe
          agent: ${vars.agent}
          input: |
            Read the JSON file at ${vars.work_dir}/2-plan/content.json. Its metadata.docs is a JSON array of news items (Doc[]) — this is the episode plan to translate. Do not edit content.json.
            Some items carry "needsTranslation": true in metadata.
            For every item with needsTranslation: translate its "title" and "body" fields into natural, concise Chinese (simplified).
            Keep everything else untouched: metadata (including needsTranslation, planScore, mergedFrom, urls), sourceUri, id, mediaType.
            Preserve any URLs inside the body text. Keep technical terms (product/model/company names) in their original form where that is clearer.
            Write the translated array — a valid JSON array of the same length, same item order, same ids — to ${vars.work_dir}/2-plan/plan.json (create the file).
            Do not wait for operator confirmation.
          expectFile: ${vars.work_dir}/2-plan/plan.json
          allowAppend: false
  - id: article
    description: "Generate the dated daily article from the episode plan (daily-article-gen template)"
    onEnter:
      - kind: shell
        options:
          command: >-
            set --;
            if [ -n "${vars.plugins_path}" ]; then set -- --plugins-path "${vars.plugins_path}"; fi;
            CONTENT_OUT="${vars.work_dir}/2-article/content-${vars.run_date}.json"; ARTICLE_MD="${vars.work_dir}/2-article/article-${vars.run_date}.md";
            if [ -f "$ARTICLE_MD" ]; then echo "article cached: $ARTICLE_MD"; else ARTICLE_DATE="${vars.run_date}" kk executor run daily-article-gen --in "${vars.work_dir}/2-plan/plan.json" --out "$CONTENT_OUT" "$@" && bun -e 'await Bun.write(process.argv[2], (await Bun.file(process.argv[1]).json()).body)' "$CONTENT_OUT" "$ARTICLE_MD"; fi
  - id: cover
    description: "Generate the article cover image via the wt-image-cover skill (agent.run)"
    onEnter:
      - kind: agent.run
        options:
          role: scribe
          agent: ${vars.agent}
          input: |
            Invoke the wt-image-cover skill.
            Generate a 21:9 cover image for the article at ${vars.work_dir}/2-article/article-${vars.run_date}.md and save it to ${vars.work_dir}/2-cover/cover-${vars.run_date}.png.
            Use style "news". If no image-generation backend is available, a procedurally rendered cover (e.g. PIL: news palette, headline typography) is an acceptable, expected deliverable — not a fake; generate it and write the file. Do not wait for operator confirmation.
          expectFile: ${vars.work_dir}/2-cover/cover-${vars.run_date}.png

  - id: script
    description: "Compile the episode plan Doc[] into structured broadcast VoiceScript YAML Content"
    onEnter:
      - kind: shell
        options:
          command: >-
            set --;
            if [ -n "${vars.plugins_path}" ]; then set -- --plugins-path "${vars.plugins_path}"; fi;
            SCRIPT_CONTENT_OUT="${vars.work_dir}/2-script/content-${vars.run_date}.json"; VOICESCRIPT_YAML="${vars.work_dir}/2-script/voicescript-${vars.run_date}.yaml";
            if [ -f "$VOICESCRIPT_YAML" ]; then echo "voicescript capped by plan: $VOICESCRIPT_YAML"; else DAILYNEWS_LANGUAGE="${vars.language}" DAILYNEWS_TITLE="${vars.title}" VOICEBOX_DEFAULT_PROFILE="${vars.voice_profile}" kk executor run dailynews-gen --in "${vars.work_dir}/2-plan/plan.json" --out "$SCRIPT_CONTENT_OUT" "$@" && bun -e 'await Bun.write(process.argv[2], (await Bun.file(process.argv[1]).json()).body)' "$SCRIPT_CONTENT_OUT" "$VOICESCRIPT_YAML"; fi

  - id: review
    description: "Operator reviews the generated news script before speech synthesis"
    pause: true
    onEnter:
      - kind: hitl.confirm
        options:
          prompt: "Review daily AI news VoiceScript at ${vars.work_dir}/2-script/voicescript-${vars.run_date}.yaml. Proceed to voice generation?"
          var: __hitlAnswer

  - id: wrap-docs
    description: "Wrap VoiceScript into Doc[] input for voice-gen"
    onEnter:
      - kind: shell
        options:
          command: >-
            bun -e 'const scriptUrl = new URL(process.argv[1], "file://" + process.cwd() + "/"); const scriptPath = decodeURIComponent(scriptUrl.pathname); const doc = { id: new Bun.CryptoHasher("sha256").update(scriptUrl.href).digest("hex").slice(0, 16), title: "Daily AI News VoiceScript", sourceUri: scriptUrl.href, body: await Bun.file(scriptPath).text(), mediaType: "application/yaml", metadata: { voiceProfile: process.argv[3] || process.env.VOICEBOX_DEFAULT_PROFILE || "robin-news" } }; await Bun.write(process.argv[2], JSON.stringify([doc], null, 2))' "${vars.work_dir}/2-script/voicescript-${vars.run_date}.yaml" "${vars.work_dir}/3-audio/docs.json" "${vars.voice_profile}"

  - id: generate
    description: "Invoke voice-gen generator plugin to generate audio"
    onEnter:
      - kind: shell
        options:
            command: >-
                set --;
                if [ -n "${vars.plugins_path}" ]; then set -- --plugins-path "${vars.plugins_path}"; fi;
                if [ -f "${vars.work_dir}/3-audio/content.json" ] && jq -e '.metadata.qc.passed == true' "${vars.work_dir}/3-audio/content.json" > /dev/null 2>&1; then echo "audio cached: ${vars.work_dir}/3-audio/content.json (QC passed)"; exit 0; fi;
                VOICE_GEN_MP3="${vars.transcode_mp3}" kk executor run voice-gen --in "${vars.work_dir}/3-audio/docs.json" --out "${vars.work_dir}/3-audio/content.json" "$@"

  - id: quality-control
    description: "Verify audio quality, speech rate, and silence/repetition QC metrics"
    onEnter:
      - kind: shell
        options:
          command: >-
            bun -e 'const content = JSON.parse(await Bun.file(process.argv[1]).text()); const qc = content.metadata?.qc; console.log("=== Voice Quality Control Report ==="); console.log("Overall Score: " + (qc ? qc.overallScore : 100) + "/100 | Passed: " + (qc ? qc.passed : true)); if (qc && qc.criticalIssues && qc.criticalIssues.length) { console.warn("QC Issues:\n" + qc.criticalIssues.map(function(i) { return "  - " + i; }).join("\n")); } else { console.log("All audio segments passed quality control checks cleanly."); }' "${vars.work_dir}/3-audio/content.json"

  - id: show-notes
    description: "Render uniform show notes from the episode plan (template, no LLM)"
    onEnter:
      - kind: shell
        options:
          command: >-
            bun -e 'const docs = JSON.parse(await Bun.file(process.argv[1]).text()); const runDate = process.argv[3]; const articleTitle = JSON.parse(await Bun.file(process.argv[4]).text()).title ?? ""; const slugify = (t) => { let s = t.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-"); return s.length > 0 ? s : "post"; }; const articleUrl = "https://surfing.salty.vip/zh/posts/" + runDate + "-" + slugify(articleTitle); const sourceLabel = (d) => { const m = d.metadata ?? {}; if (typeof m.sourceName === "string" && m.sourceName.trim()) return m.sourceName.trim(); try { return new URL(d.sourceUri ?? "").hostname.replace(/^www\./, ""); } catch { return "来源"; } }; const lines = ["# " + (process.argv[5] || articleTitle), ""]; docs.forEach((d, i) => { const body = (d.body ?? "").trim(); const sentences = body.split(/(?<=[。！？])\s*/).slice(0, 2).join(""); lines.push("## " + (i + 1) + ". " + (d.title ?? "条目 " + (i + 1)), "", sentences, "", "[来源：" + sourceLabel(d) + "](" + (d.sourceUri ?? "") + ")", ""); }); lines.push("详情见本期完整文章：[ " + articleTitle + " ](" + articleUrl + ")", ""); await Bun.write(process.argv[2], lines.join("\n"))' "${vars.work_dir}/2-plan/plan.json" "${vars.work_dir}/3-publish/show-notes.md" "${vars.run_date}" "${vars.work_dir}/2-article/content-${vars.run_date}.json" "${vars.title}"
  - id: publish-prep
    description: "Merge article Content with audio + cover + run date + show-notes summary (podcast seam)"
    onEnter:
      - kind: shell
        options:
          command: >-
            bun -e 'const article = JSON.parse(await Bun.file(process.argv[1]).text()); const audio = JSON.parse(await Bun.file(process.argv[2]).text()); const audioMeta = audio.metadata ?? {}; const rawFile = audioMeta.mp3Path ?? audioMeta.audioPath; if (!rawFile) { console.error("publish-prep: voice content carries no mp3Path/audioPath"); process.exit(1); } const { resolve } = await import("node:path"); const { existsSync } = await import("node:fs"); const audioFile = resolve(rawFile); const coverPath = resolve(process.argv[4]); const showNotesPath = process.argv[5]; let showNotes; if (existsSync(showNotesPath)) { showNotes = await Bun.file(showNotesPath).text(); } const merged = { ...article, metadata: { ...(article.metadata ?? {}), audioFile, durationSeconds: audioMeta.duration, runDate: process.argv[6], ...(existsSync(coverPath) ? { coverImage: coverPath } : {}), ...(showNotes !== undefined ? { showNotes } : {}) } }; await Bun.write(process.argv[3], JSON.stringify(merged, null, 2))' "${vars.work_dir}/2-article/content-${vars.run_date}.json" "${vars.work_dir}/3-audio/content.json" "${vars.work_dir}/3-publish/content.json" "${vars.work_dir}/2-cover/cover-${vars.run_date}.png" "${vars.work_dir}/3-publish/show-notes.md" "${vars.run_date}"

  - id: publish
    description: "Fan out the merged Content to surfdash-pub and podcast-pub (article as episode show notes)"
    onEnter:
      - kind: shell
        options:
          command: >-
            set --;
            if [ -n "${vars.plugins_path}" ]; then set -- --plugins-path "${vars.plugins_path}"; fi;
            if jq -e '.ok == true and ([.targets[]? | select(.ok == true and .status == "published")] | length) == 2' "${vars.work_dir}/3-publish/result.json" > /dev/null 2>&1; then echo "publish cached: result.json (2 targets ok)"; exit 0; fi;
            env -u SPUR_WORKFLOW_RUN_ACTIVE kk executor fan-out --content "${vars.work_dir}/3-publish/content.json" --target surfdash-pub --target podcast-pub --out "${vars.work_dir}/3-publish/result.json" "$@"


  - id: translate-en
    description: "Scaffold en draft from the zh article (postPath from publish result)"
    onEnter:
      - kind: shell
        options:
          command: >-
            bun -e 'const result = JSON.parse(await Bun.file(process.argv[1]).text()); const entry = result.targets?.find(t => t.target === "surfdash-pub" && t.ok); const path = entry?.metadata?.postPath; const valid = typeof path === "string" && path.endsWith("index.md"); if (!valid) console.error("translate-en: no surfdash-pub postPath in result — locale steps will be skipped"); await Bun.write(process.argv[2], valid ? path : ""); await Bun.write(process.argv[3], valid ? path.split("/zh/").join("/en/") : "")' "${vars.work_dir}/3-publish/result.json" "${vars.work_dir}/3-publish/zh-post-path.txt" "${vars.work_dir}/3-publish/en-post-path.txt"
      - kind: file.read.into-var
        options:
          path: ${vars.work_dir}/3-publish/zh-post-path.txt
          var: surfdash_post_path
      - kind: file.read.into-var
        options:
          path: ${vars.work_dir}/3-publish/en-post-path.txt
          var: surfdash_en_post_path
      - kind: shell
        options:
          command: >-
            test -n "${vars.surfdash_post_path}" || { echo "no zh post path — skip translate-en"; exit 0; };
            if [ -f "${vars.surfdash_en_post_path}" ]; then echo "en draft cached: ${vars.surfdash_en_post_path}"; exit 0; fi;
            SURFDASH_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "${vars.surfdash_post_path}")")")")")")";
            (cd "$SURFDASH_ROOT" && bun run sd translate "${vars.surfdash_post_path}" --source zh --target en) &&
            cp -R "$(dirname "${vars.surfdash_post_path}")/assets" "$(dirname "${vars.surfdash_en_post_path}")/assets" 2>/dev/null || true

  - id: translate-en-agent
    description: "Translate the en draft in place via agent.run"
    onEnter:
      - kind: agent.run
        options:
          role: scribe
          agent: ${vars.agent}
          input: |
            Translate the English draft post at ${vars.surfdash_en_post_path} from Chinese to English.
            Edit the file in place: translate the title in frontmatter and the whole markdown body to natural English. Keep frontmatter keys, dates, URLs, code, and the assets/ image reference untouched. Keep the draft: true flag.
            Read the surfdash translator glossary if present at the surfdash checkout root under .agents/skills/surfdash-translator/glossary.md and apply its terminology.
            Do not wait for operator confirmation. The file must end fully in English.
          expectFile: ${vars.surfdash_en_post_path}

  - id: translate-ja
    description: "Scaffold ja draft from the zh article"
    onEnter:
      - kind: shell
        options:
          command: >-
            test -n "${vars.surfdash_post_path}" || { echo "no zh post path — skip translate-ja"; exit 0; };
            JA="$(printf '%s' "${vars.surfdash_post_path}" | sed 's|/zh/|/ja/|')";
            if [ -f "$JA" ]; then echo "ja draft cached: $JA"; exit 0; fi;
            SURFDASH_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "${vars.surfdash_post_path}")")")")")")";
            (cd "$SURFDASH_ROOT" && bun run sd translate "${vars.surfdash_post_path}" --source zh --target ja) &&
            cp -R "$(dirname "${vars.surfdash_post_path}")/assets" "$(dirname "$JA")/assets" 2>/dev/null || true
      - kind: shell
        options:
          command: >-
            printf '%s' "${vars.surfdash_post_path}" | sed 's|/zh/|/ja/|' > "${vars.work_dir}/3-publish/ja-post-path.txt"
      - kind: file.read.into-var
        options:
          path: ${vars.work_dir}/3-publish/ja-post-path.txt
          var: surfdash_ja_post_path

  - id: translate-ja-agent
    description: "Translate the ja draft in place via agent.run"
    onEnter:
      - kind: agent.run
        options:
          role: scribe
          agent: ${vars.agent}
          input: |
            Translate the Japanese draft post at ${vars.surfdash_ja_post_path} from Chinese to Japanese.
            Edit the file in place: translate the title in frontmatter and the whole markdown body to natural Japanese. Keep frontmatter keys, dates, URLs, code, and the assets/ image reference untouched. Keep the draft: true flag.
            Read the surfdash translator glossary if present at the surfdash checkout root under .agents/skills/surfdash-translator/glossary.md and apply its terminology.
            Do not wait for operator confirmation. The file must end fully in Japanese.
          expectFile: ${vars.surfdash_ja_post_path}

  - id: translate-sync
    description: "Sync the zh post and its en/ja locale variants into the surfdash CMS"
    onEnter:
      - kind: shell
        options:
          command: >-
            test -n "${vars.surfdash_post_path}" || { echo "no zh post path — skip translate-sync"; exit 0; };
            SURFDASH_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "${vars.surfdash_post_path}")")")")")")";
            (cd "$SURFDASH_ROOT" && bun scripts/publish-orchestrator.ts sync "${vars.surfdash_post_path}")
  - id: done
    description: "Terminal — Daily AI news pipeline completed (collect → facts → article/cover/script/voice → publish)"
  - id: failed
    description: "Terminal — Pipeline failed"

transitions:
  - from: prepare
    to: fetch
    description: "Workspace prepared -> fetch news items"
    guard:
      kind: always

  - from: fetch
    to: ingest-last30days
    description: "last30days_enabled -> ingest last-30-days source"
    guard:
      kind: shell
      options:
        command: 'test "${vars.last30days_enabled}" = "true"'

  - from: fetch
    to: ingest-horizon
    description: "last30days disabled -> skip directly to Horizon crawl"
    guard:
      kind: shell
      options:
        command: 'test "${vars.last30days_enabled}" != "true"'

  - from: ingest-last30days
    to: ingest-horizon
    description: "last30days ingested -> Horizon crawl"
    guard:
      kind: always

  - from: ingest-horizon
    to: blend-facts
    description: "Horizon ingested -> merge + render core facts"
    guard:
      kind: always

  - from: blend-facts
    to: plan
    description: "Core facts rendered -> plan the episode (score/dedup/select)"
    guard:
      kind: always

  - from: plan
    to: plan-translate
    description: "plan_translate_enabled -> translate flagged items in place"
    guard:
      kind: shell
      options:
        command: 'test "${vars.plan_translate_enabled}" = "true"'

  - from: plan
    to: article
    description: "plan-translate disabled -> skip straight to article"
    guard:
      kind: always

  - from: plan-translate
    to: article
    description: "Plan translated -> generate article from plan"
    guard:
      kind: always

  - from: article
    to: cover
    description: "cover_enabled -> generate cover image"
    guard:
      kind: shell
      options:
        command: 'test "${vars.cover_enabled}" = "true" && test ! -f "${vars.work_dir}/2-cover/cover-${vars.run_date}.png"'

  - from: article
    to: script
    description: "cover disabled or today's cover cached -> skip to script"
    guard:
      kind: always
  - from: cover
    to: script
    description: "Cover generated -> build broadcast script"
    guard:
      kind: always

  - from: script
    to: wrap-docs
    description: "skip_review enabled -> bypass HITL review"
    guard:
      kind: shell
      options:
        command: 'test "${vars.skip_review}" = "true"'

  - from: script
    to: review
    description: "skip_review disabled -> pause for operator review"
    guard:
      kind: always

  - from: review
    to: wrap-docs
    description: "VoiceScript approved -> wrap for audio generation"
    guard:
      kind: shell
      options:
        command: 'test "${vars.__hitlAnswer}" = "yes"'

  - from: review
    to: failed
    description: "VoiceScript rejected -> abort"
    guard:
      kind: shell
      options:
        command: 'test "${vars.__hitlAnswer}" = "no"'

  - from: wrap-docs
    to: generate
    description: "Doc[] wrapped -> synthesize audio"
    guard:
      kind: always

  - from: generate
    to: quality-control
    description: "Audio generated -> run quality control validation"
    guard:
      kind: always

  - from: quality-control
    to: show-notes
    description: "publish enabled AND QC passed -> derive show notes from article"
    guard:
      kind: shell
      options:
        command: 'test "${vars.publish_enabled}" = "true" && test "$(jq -r ''.metadata.qc.passed // true'' "${vars.work_dir}/3-audio/content.json")" = "true"'

  - from: show-notes
    to: publish-prep
    description: "Show notes derived -> merge article + audio + cover + runDate for fan-out"
    guard:
      kind: always

  - from: publish-prep
    to: publish
    description: "Merged publish Content -> fan out to targets"
    guard:
      kind: always

  - from: quality-control
    to: done
    description: "QC passed (publish off or after gate) -> done"
    guard:
      kind: shell
      options:
        command: 'test "$(jq -r ''.metadata.qc.passed // true'' "${vars.work_dir}/3-audio/content.json")" = "true"'

  - from: quality-control
    to: failed
    description: "QC failed -> abort rather than publish a noisy episode"
    guard:
      kind: always

  - from: publish
    to: translate-en
    description: "Publish fan-out complete -> scaffold + translate en locale"
    guard:
      kind: always

  - from: translate-en
    to: translate-en-agent
    description: "zh path resolved -> run en translation agent"
    guard:
      kind: shell
      options:
        command: 'test -n "${vars.surfdash_post_path}" && test -f "${vars.surfdash_en_post_path}"'

  - from: translate-en
    to: translate-ja
    description: "no zh post path -> skip en translation"
    guard:
      kind: always

  - from: translate-en-agent
    to: translate-ja
    description: "en translation complete -> scaffold ja locale"
    guard:
      kind: always

  - from: translate-ja
    to: translate-ja-agent
    description: "zh path resolved -> run ja translation agent"
    guard:
      kind: shell
      options:
        command: 'test -n "${vars.surfdash_post_path}" && test -f "${vars.surfdash_ja_post_path}"'

  - from: translate-ja
    to: translate-sync
    description: "no zh post path -> skip ja translation"
    guard:
      kind: always

  - from: translate-ja-agent
    to: translate-sync
    description: "ja translation complete -> sync locales to CMS"
    guard:
      kind: always

  - from: translate-sync
    to: done
    description: "Locale sync complete -> done"
    guard:
      kind: always

