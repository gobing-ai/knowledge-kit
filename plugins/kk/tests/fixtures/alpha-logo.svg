<?xml version="1.0" encoding="UTF-8"?>
<!--
  0387 R1 — checked-in TRANSPARENT emblem fixture for deterministic cover verification.
  The operator's reference banner is absent on this machine, so the badge-blend previews
  (cover-compositor `writeCoverPreviews`) fuse THIS emblem instead of inventing a fake operator
  asset. Nothing in the canvas is opaque: the background is unset and every shape carries its own
  alpha, so the emblem must blend over the AI background exactly like the shipped
  `assets/general/xhxs.svg` does. The real reference comparison (operator banner vs this fixture
  geometry) stays a separate operator check.

  viewBox matches the badge clip the compositor applies to the shipped asset (0 0 1095 760), so
  the same `logoBadgeSvg` path renders both.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1095" height="760" viewBox="0 0 1095 760" role="img">
    <title>0387 transparent logo fixture</title>
  <circle cx="180" cy="200" r="150" fill="#FFB800" fill-opacity="0.82"/>
  <circle cx="180" cy="200" r="96" fill="#FFFFFF" fill-opacity="0.55"/>
  <path d="M120 300 L360 300 L240 560 Z" fill="#FF3B30" opacity="0.72"/>
  <path d="M420 140 h360 a26 26 0 0 1 26 26 v88 a26 26 0 0 1 -26 26 h-360 a26 26 0 0 1 -26 -26 v-88 a26 26 0 0 1 26 -26 z"
        fill="#0A1424" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="8"/>
</svg>
