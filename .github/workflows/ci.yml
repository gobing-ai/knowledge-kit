name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    # ubuntu-latest rotated to ubuntu-26.04 (early Nov 2026); the workspace-pinned
    # playwright 1.55.0 (build 1187) ships no chromium for ubuntu26.04-x64
    # (run 41669313930). Pin the runner to the last image that works.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        # --ignore-scripts: the root `prepare` (lefthook install) targets local
        # dev hooks; lefthook is proto-pinned, not an npm dep, so it is absent
        # on runners. CI never commits, so hooks are not needed here.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install ffmpeg
        # ubuntu-26 runner images dropped ffmpeg from the preinstalled set;
        # voice-gen tests (applySpeed/transcode) and the coverage gate need it.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install spur
        # The kk workflow integration tests drive the real engine (`spur workflow run`),
        # and refuse to skip silently when the binary is missing. Policy (AGENTS.md):
        # spur/superskill are never pinned — CI tracks @latest so the suite exercises
        # the engine users actually run; a breaking upstream release fails here, loudly,
        # instead of silently diverging from developer machines.
        run: |
          bun install --global @gobing-ai/spur@latest
          echo "$(bun pm bin -g)" >> "$GITHUB_PATH"

      - name: Provision the home-level @gobing-ai tree the Board suite resolves against
        # The installed-Board suite drives spur by importing `@gobing-ai/spur` from the
        # node_modules walk-up before falling back to PATH, and spur probes its sibling
        # @gobing-ai packages at runtime relative to where its entry executes from.
        # Developer machines satisfy this via home-level global installs
        # (~/node_modules/@gobing-ai/*); an isolated global bun install cannot, and the
        # suite's run-history reads then 404. Mirror the proven sibling set at $HOME so
        # resolution and sibling probing behave like the verified environment.
        run: |
          test -f "$HOME/package.json" || echo '{"name":"runner-home","private":true}' > "$HOME/package.json"
          cd "$HOME"
          bun add @gobing-ai/spur@latest @gobing-ai/knowledge-kit@latest @gobing-ai/superskill@latest @gobing-ai/ts-ai-runner@latest @gobing-ai/ts-db@latest @gobing-ai/ts-infra@latest @gobing-ai/ts-runtime@latest @gobing-ai/ts-utils@latest

      # Build first so cross-package type imports resolve during typecheck.
      # A clean CI checkout has no prebuilt dist/.
      - name: Build
        run: bun run build

      - name: Put kk on PATH
        # The stage runner spawns bare `kk` for plugin executor runs and the surfdash patch
        # tests drive the real executor; there is no global kk install on runners. The built
        # dist/index.js carries the bun shebang, so a symlink resolves like a real binary.
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -s "$PWD/apps/cli/dist/index.js" "$HOME/.local/bin/kk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Playwright chromium
        # The Board acceptance tests launch chromium. Run bunx from apps/board so it resolves
        # the workspace's pinned playwright (1.55.0 → build 1187): from the repo root bunx
        # finds no playwright binary and auto-installs playwright@latest, whose build (1248)
        # does not match what the test launches (measured 2026-10-14, run 38634148889).
        working-directory: apps/board
        run: bunx playwright install chromium

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test
        env:
          TMPDIR: /tmp
          HOME: /home/runner
