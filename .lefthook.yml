commit-msg:
  commands:
    cog:
      run: cog verify --file {1}

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,tsx,jsx,json}"
      run: bun run format

pre-push:
  commands:
    cog:
      # Verify only what's being pushed; bare `cog check` falls back to repo root
      # because the @scope/pkg-vX.Y.Z tags aren't cocogitto-parseable.
      run: cog check origin/main..HEAD
    lint:
      run: bun run lint
