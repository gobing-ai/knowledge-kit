commit-msg:
  commands:
    cog:
      run: cog verify --file {1}

prepare-commit-msg:
  commands:
    merge-subject:
      # cog parses every message as a Conventional Commit, merges included, but git writes
      # `Merge branch 'main' of <url>` — so the merge auto-commit is rejected and left open with
      # MERGE_HEAD set. Rewrite the subject before commit-msg sees it (scripts/merge-commit-subject.ts).
      run: bun scripts/merge-commit-subject.ts {1} {2} "$(git rev-parse --short MERGE_HEAD 2>/dev/null || echo unknown)" "$(git branch --show-current)"

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,tsx,jsx,json}"
      run: bun run format
    bundle-plugins:
      glob: "{plugins/kk/scripts/**,plugins/kk/workflows/**,plugins/**/plugin.json}"
      run: bun scripts/bundle-plugins.ts --if-stale

post-checkout:
  commands:
    bundle-plugins:
      run: bun scripts/bundle-plugins.ts --if-stale
    build-board:
      run: bun scripts/build-board.ts

post-merge:
  commands:
    bundle-plugins:
      run: bun scripts/bundle-plugins.ts --if-stale
    build-board:
      run: bun scripts/build-board.ts

pre-push:
  commands:
    cog:
      # Verify only what's being pushed; bare `cog check` falls back to repo root
      # because the @scope/pkg-vX.Y.Z tags aren't cocogitto-parseable.
      run: cog check origin/main..HEAD
    lint:
      # Hooks capture output; disable Bun's interactive workspace redraws in that log.
      run: CI=1 bun run lint
